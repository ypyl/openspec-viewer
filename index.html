<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSpec Local Viewer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --border-muted: #21262d;
      --fg: #c9d1d9;
      --fg-muted: #8b949e;
      --fg-subtle: #6e7681;
      --accent: #58a6ff;
      --accent-dim: #1f6feb;
      --green: #3fb950;
      --purple: #bc8cff;
      --orange: #d29922;
      --red: #f85149;
      --pink: #f778ba;
      --code-bg: #0d1117;
      --scroll-thumb: #484f58;
      --radius: 6px;
      color-scheme: dark;
    }
    /* GitHub-light palette */
    :root[data-theme="light"] {
      --bg: #ffffff;
      --panel: #f6f8fa;
      --border: #d0d7de;
      --border-muted: #d8dee4;
      --fg: #1f2328;
      --fg-muted: #59636e;
      --fg-subtle: #818b98;
      --accent: #0969da;
      --accent-dim: #0969da;
      --green: #1a7f37;
      --purple: #8250df;
      --orange: #9a6700;
      --red: #cf222e;
      --pink: #bf3989;
      --code-bg: #f6f8fa;
      --scroll-thumb: #c8d1d9;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      font-size: 14px;
      line-height: 1.6;
    }

    /* ---------- Header ---------- */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    header h1 .dot { color: var(--accent); }
    .theme-btn {
      margin-left: 8px;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: background .15s;
    }
    .theme-btn:hover { background: var(--panel); }
    #stats { font-size: 12px; color: var(--fg-muted); margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #stats b { color: var(--fg); font-weight: 600; }

    /* ---------- Layout ---------- */
    .layout { display: flex; flex: 1; min-height: 0; }

    aside {
      width: 340px;
      flex-shrink: 0;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 28px 40px 60px;
      min-width: 0;
    }

    /* ---------- Sidebar controls ---------- */
    .controls { padding: 12px; border-bottom: 1px solid var(--border-muted); display: flex; flex-direction: column; gap: 10px; }
    .pick-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--accent-dim);
      color: #fff;
      border: 1px solid rgba(240,246,252,.1);
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s;
    }
    .pick-btn:hover { background: #2a6fd9; }
    #picker { display: none; }
    .search-row { position: relative; display: flex; align-items: center; }
    .search-row svg {
      position: absolute; left: 10px; pointer-events: none;
      color: var(--fg-subtle); width: 14px; height: 14px;
    }
    #search {
      width: 100%;
      padding: 7px 10px 7px 30px;
      background: var(--bg);
      border: 1px solid var(--border-muted);
      border-radius: var(--radius);
      color: var(--fg);
      font-size: 13px;
      outline: none;
    }
    #search:focus { border-color: var(--accent-dim); box-shadow: 0 0 0 3px rgba(31,111,235,.3); }
    #search::placeholder { color: var(--fg-subtle); }

    /* ---------- File list ---------- */
    #file-list { flex: 1; overflow-y: auto; padding: 8px 0; }
    .group-label {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px 8px 14px;
      cursor: pointer;
      user-select: none;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--gc, var(--fg-subtle));
      border-top: 1px solid var(--border-muted);
      transition: color .12s, background .12s;
    }
    .group-label.sticky {
      position: sticky;
      top: 0;
      background: var(--panel);
      z-index: 2;
    }
    .group-label:hover { color: var(--gc, var(--fg)); background: rgba(110,118,129,.06); }
    .group-label .chevron {
      font-size: 9px;
      color: var(--gc, var(--fg-subtle));
      display: inline-block;
      transition: transform .12s;
    }
    .group-label.collapsed .chevron { transform: rotate(-90deg); }
    .group-label .group-name { flex: 1; }
    .group-label.g-changes { --gc: var(--accent); }
    .group-label.g-archive { --gc: var(--purple); }
    .group-label.g-specs   { --gc: var(--green); }
    .group-label.g-config  { --gc: var(--orange); }
    .group-count {
      font-size: 10px;
      font-weight: 600;
      color: var(--gc, var(--fg-subtle));
      background: color-mix(in srgb, var(--gc, var(--fg-subtle)) 12%, transparent);
      border-radius: 10px;
      padding: 0 7px;
      line-height: 16px;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 14px;
      cursor: pointer;
      color: var(--fg-muted);
      border-left: 2px solid transparent;
      word-break: break-all;
    }
    .item:hover { background: rgba(110,118,129,.1); color: var(--fg); }
    .item.active { background: rgba(31,111,235,.15); border-left-color: var(--accent); color: var(--fg); }
    .item .path { font-size: 12.5px; }
    .item.active .path { color: var(--fg); }
    .badge {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .4px;
      padding: 1px 6px;
      border-radius: 20px;
      border: 1px solid var(--border);
      color: var(--fg-muted);
    }
    .badge.proposal { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
    .badge.design   { color: var(--purple); border-color: color-mix(in srgb, var(--purple) 45%, transparent); }
    .badge.tasks    { color: var(--orange); border-color: color-mix(in srgb, var(--orange) 45%, transparent); }
    .badge.spec     { color: var(--green);  border-color: color-mix(in srgb, var(--green) 45%, transparent); }
    .badge.metadata { color: var(--pink);   border-color: color-mix(in srgb, var(--pink) 45%, transparent); }
    .badge.config   { color: var(--fg);     border-color: var(--border); }
    .empty {
      padding: 24px 14px;
      text-align: center;
      color: var(--fg-subtle);
      font-size: 13px;
    }
    .live-dot { color: var(--green); font-weight: 600; }

    /* ---------- Main content ---------- */
    .crumb {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12.5px;
      color: var(--fg-muted);
      margin-bottom: 16px;
    }
    .crumb .seg { color: var(--accent); text-decoration: none; }
    .crumb .sep { color: var(--fg-subtle); }
    .crumb .file { color: var(--fg); font-weight: 500; word-break: break-all; }
    .meta-card {
      background: var(--panel);
      border: 1px solid var(--border-muted);
      border-left: 3px solid var(--accent-dim);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 20px;
      font-size: 13px;
    }
    .meta-card h3 {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--fg-subtle);
    }
    .meta-table { width: 100%; border-collapse: collapse; }
    .meta-table td { padding: 3px 8px 3px 0; vertical-align: top; }
    .meta-table td:first-child {
      width: 130px;
      color: var(--fg-muted);
      white-space: nowrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }
    .meta-table td:last-child { color: var(--fg); word-break: break-word; }
    .meta-error { color: var(--red); font-size: 12px; }
    .progress { margin: 6px 0 2px; }
    .progress-track {
      height: 6px;
      background: var(--border-muted);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-fill {
      height: 100%;
      background: var(--green);
      border-radius: 3px;
      transition: width .3s;
    }

    .pane-loading { color: var(--fg-subtle); padding: 10px 0; }

    /* ---------- Change tabs ---------- */
    .change-head {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .change-head h2 { margin: 0; font-size: 20px; color: var(--fg); }
    .change-head .date-badge {
      font-size: 11px;
      color: var(--fg-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      border: 1px solid var(--border-muted);
      border-radius: 12px;
      padding: 1px 8px;
    }
    .change-head .path-sub { font-size: 12px; color: var(--fg-subtle); word-break: break-all; }
    .tabs {
      display: flex;
      gap: 2px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .tab {
      padding: 7px 14px;
      background: transparent;
      color: var(--tabc, var(--fg-muted));
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: var(--radius) var(--radius) 0 0;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    .tab:hover { color: var(--tabc, var(--fg)); background: rgba(110,118,129,.08); }
    .tab.active { color: var(--tabc, var(--accent)); border-bottom-color: var(--tabc, var(--accent)); background: rgba(110,118,129,.12); }
    .tab.proposal { --tabc: var(--accent); }
    .tab.design   { --tabc: var(--purple); }
    .tab.tasks    { --tabc: var(--orange); }
    .tab.spec     { --tabc: var(--green); }
    .tab.metadata { --tabc: var(--pink); }
    .tab.config   { --tabc: var(--fg); }

    /* ---------- Archive rows ---------- */
    .item .date {
      margin-left: auto;
      font-size: 11px;
      color: var(--fg-subtle);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      flex-shrink: 0;
    }

    /* ---------- Markdown content ---------- */
    .markdown { max-width: 860px; }
    .markdown h1, .markdown h2, .markdown h3, .markdown h4 {
      border-bottom: 1px solid var(--border-muted);
      padding-bottom: .3em;
      margin-top: 1.5em;
      font-weight: 600;
      line-height: 1.25;
    }
    .markdown h1 { font-size: 1.7em; }
    .markdown h2 { font-size: 1.4em; }
    .markdown h3 { font-size: 1.15em; }
    .markdown h4 { font-size: 1em; }
    .markdown a { color: var(--accent); text-decoration: none; }
    .markdown a:hover { text-decoration: underline; }
    .markdown code {
      background: rgba(110,118,129,.2);
      border-radius: 4px;
      padding: .1em .35em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 85%;
    }
    .markdown pre {
      background: var(--code-bg);
      border: 1px solid var(--border-muted);
      border-radius: var(--radius);
      padding: 14px;
      overflow-x: auto;
      line-height: 1.45;
    }
    .markdown pre code { background: none; padding: 0; font-size: 12.5px; }
    .markdown blockquote {
      margin: 0 0 16px;
      padding: 0 1em;
      border-left: .25em solid var(--border);
      color: var(--fg-muted);
    }
    .markdown table {
      border-collapse: collapse;
      display: block;
      max-width: 100%;
      overflow: auto;
      margin: 16px 0;
    }
    .markdown table th, .markdown table td {
      border: 1px solid var(--border-muted);
      padding: 6px 13px;
    }
    .markdown table th { background: var(--panel); font-weight: 600; }
    .markdown img { max-width: 100%; }
    .markdown hr { border: none; border-top: 1px solid var(--border-muted); margin: 24px 0; }
    .markdown li.task-done { color: var(--fg-subtle); }
    .markdown li.task-done input { opacity: .5; }

    /* ---------- Welcome ---------- */
    .welcome {
      max-width: 560px;
      margin: 80px auto;
      text-align: center;
      color: var(--fg-muted);
    }
    .welcome .icon { font-size: 44px; }
    .welcome h2 { color: var(--fg); font-size: 20px; margin: 12px 0 8px; }
    .welcome p { font-size: 13.5px; line-height: 1.7; }
    .welcome code { background: rgba(110,118,129,.2); border-radius: 4px; padding: .1em .35em; font-size: 12.5px; }

    /* ---------- YAML / raw ---------- */
    .yaml-view {
      background: var(--code-bg);
      border: 1px solid var(--border-muted);
      border-radius: var(--radius);
      padding: 16px;
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ---------- Scrollbars ---------- */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 5px; border: 2px solid var(--panel); }
    ::-webkit-scrollbar-track { background: transparent; }

    @media (max-width: 800px) {
      aside { width: 260px; }
      main { padding: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>OpenSpec <span class="dot">•</span> Local Viewer</h1>
    <button id="theme-btn" class="theme-btn" title="Toggle dark / light theme">☀️</button>
    <div id="stats"></div>
  </header>

  <div class="layout">
    <aside>
      <div class="controls">
        <button class="pick-btn" id="pick-btn">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M1.75 1A1.75 1.75 0 000 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0016 13.25V2.75A1.75 1.75 0 0014.25 1H1.75zM1.5 2.75a.25.25 0 01.25-.25h12.5a.25.25 0 01.25.25v10.5a.25.25 0 01-.25.25H1.75a.25.25 0 01-.25-.25V2.75zM3 4.75a.75.75 0 100 1.5.75.75 0 000-1.5zm3 0a.75.75 0 100 1.5.75.75 0 000-1.5zM3 8.5a.75.75 0 100 1.5.75.75 0 000-1.5zm3 0a.75.75 0 100 1.5.75.75 0 000-1.5zm3 0a.75.75 0 100 1.5.75.75 0 000-1.5zM8.5 12a.75.75 0 100 1.5.75.75 0 000-1.5zM11 8.5a.75.75 0 100 1.5.75.75 0 000-1.5zm3 0a.75.75 0 100 1.5.75.75 0 000-1.5zM3 12.25a.75.75 0 100 1.5.75.75 0 000-1.5zm3 0a.75.75 0 100 1.5.75.75 0 000-1.5zm3 0a.75.75 0 100 1.5.75.75 0 000-1.5zM11 12a.75.75 0 100 1.5.75.75 0 000-1.5z"/></svg>
          Select Folder to Monitor
        </button>
        <input type="file" id="picker" webkitdirectory multiple />
        <div class="search-row">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M10.68 11.74a6 6 0 111.06-1.06l3.04 3.04a.75.75 0 11-1.06 1.06l-3.04-3.04zM11.5 7a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z"/></svg>
          <input id="search" type="text" placeholder="Filter files…  ( / )" autocomplete="off">
        </div>
      </div>
      <div id="file-list"></div>
    </aside>

    <main id="content"></main>
  </div>

  <script>
    'use strict';

    const picker = document.getElementById('picker');
    const pickBtn = document.getElementById('pick-btn');
    const searchEl = document.getElementById('search');
    const listEl = document.getElementById('file-list');
    const contentEl = document.getElementById('content');
    const statsEl = document.getElementById('stats');
    const themeBtn = document.getElementById('theme-btn');

    // ---------- Theme ----------
    let theme = 'dark';
    try { theme = localStorage.getItem('osviewer.theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
    function applyTheme(t) {
      theme = t;
      document.documentElement.dataset.theme = t;
      themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
      try { localStorage.setItem('osviewer.theme', t); } catch (e) {}
    }
    applyTheme(theme);
    themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));

    let allFiles = [];   // [{ rel, handle }] handle = FileSystemFileHandle (monitored) or File (one-shot)
    let currentRel = null;
    let currentKey = null;        // selected change (active or archived)
    let currentTabs = [];         // tabs in the open change view
    let dirHandle = null;         // FileSystemDirectoryHandle being monitored
    let pollTimer = null;         // setInterval id for the poll loop
    let isScanning = false;       // guard against overlapping scans
    const fileState = new Map();  // rel -> { handle, lastModified } snapshot for change detection
    const changeMeta = new Map(); // change key -> { key, dir, label, date, proposalRel, files }
    const paneCache = new Map();  // rel -> rendered pane HTML

    const esc = s => String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    /* ---------- Path helpers ---------- */

    // Paths come in relative to the picked folder. If the repo root was picked,
    // they start with "openspec/…"; strip any path up to and including the
    // first "openspec" segment so browsing works from either the repo root or
    // the openspec folder itself.
    function normPath(p) {
      const parts = p.split('/');
      const i = parts.indexOf('openspec');
      if (i >= 0) return parts.slice(i + 1).join('/');
      return p;
    }

    function artifactOf(rel) {
      const name = rel.split('/').pop();
      if (name === 'proposal.md') return 'Proposal';
      if (name === 'design.md') return 'Design';
      if (name === 'tasks.md') return 'Tasks';
      if (name === 'config.yaml') return 'Config';
      if (name.endsWith('.openspec.yaml')) return 'Metadata';
      if (name.endsWith('spec.md')) return 'Spec';
      return 'Doc';
    }

    function isRelevant(rel) {
      // .openspec.yaml is a real artifact; other dotfiles (like .gitkeep) are noise.
      return /\.(md|ya?ml|json)$/i.test(rel) &&
        (rel.endsWith('.openspec.yaml') || !rel.split('/').pop().startsWith('.'));
    }

    const GROUPS = ['Changes', 'Archive', 'Specs', 'Config'];

    function isArchived(rel) {
      return rel.startsWith('changes/archive/');
    }

    // Only four sections. Archive lives under changes/archive per the
    // standard openspec CLI layout; everything else is ignored.
    function groupOf(rel) {
      if (rel === 'config.yaml' || rel.startsWith('config/')) return 'Config';
      if (isArchived(rel)) return 'Archive';
      if (rel.startsWith('changes/')) return 'Changes';
      if (rel.startsWith('specs/')) return 'Specs';
      return null;
    }

    function displayLabel(rel, group) {
      if (group === 'Changes') return rel.slice('changes/'.length);                 // <change>/<file…>
      if (group === 'Archive') return rel.slice('changes/archive/'.length);         // <date>-<change>/<file…>
      if (group === 'Specs') return rel.slice('specs/'.length).replace(/\/spec\.md$/, '');  // <capability>
      return rel;                                                                   // config.yaml
    }

    function changeOf(rel) {
      if (isArchived(rel)) return rel.split('/').slice(0, 3).join('/');             // changes/archive/<name>
      if (rel.startsWith('changes/')) return rel.split('/').slice(0, 2).join('/');  // changes/<name>
      return null;
    }

    function prettyChangeName(dir) {
      let n = dir, date = '';
      const m = n.match(/^(\d{4}-\d{2}-\d{2})-(.*)$/);
      if (m) { date = m[1]; n = m[2]; }
      const label = n.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      return { label, date };
    }

    function buildChangeMeta() {
      changeMeta.clear();
      const byKey = new Map();
      for (const f of allFiles) {
        const key = changeOf(f.rel);
        if (!key) continue;
        if (!byKey.has(key)) byKey.set(key, []);
        byKey.get(key).push(f);
      }
      for (const [key, files] of byKey) {
        const dir = key.split('/').pop();
        const { label, date } = prettyChangeName(dir);
        const proposal = files.find(f => f.rel.endsWith('/proposal.md'));
        changeMeta.set(key, {
          key, dir, label, date,
          proposalRel: proposal ? proposal.rel : null,
          files,
        });
      }
    }

    /* ---------- Picker ---------- */

    /* ---------- Remember the last picked folder (IndexedDB) ---------- */

    const IDB_NAME = 'osviewer';
    const IDB_STORE = 'handles';
    function idbOpen() {
      return new Promise((res, rej) => {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      });
    }
    async function saveHandle(handle) {
      try {
        const db = await idbOpen();
        await new Promise((res, rej) => {
          const tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).put(handle, 'dir');
          tx.oncomplete = res;
          tx.onerror = () => rej(tx.error);
        });
      } catch (e) { /* non-fatal */ }
    }
    async function loadHandle() {
      try {
        const db = await idbOpen();
        return await new Promise((res, rej) => {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const r = tx.objectStore(IDB_STORE).get('dir');
          r.onsuccess = () => res(r.result || null);
          r.onerror = () => rej(r.error);
        });
      } catch (e) { return null; }
    }

    pickBtn.addEventListener('click', async () => {
      if (window.showDirectoryPicker) {
        try {
          const saved = await loadHandle();
          let dir;
          try {
            // Open the picker at the previously used folder when possible.
            dir = await window.showDirectoryPicker({ startIn: saved || undefined });
          } catch (err) {
            if (err.name === 'AbortError') throw err;         // user cancelled
            dir = await window.showDirectoryPicker();          // stale handle -> fresh
          }
          dirHandle = dir;
          saveHandle(dir);
          await startMonitoring(dir);
        } catch (err) {
          if (err.name !== 'AbortError') {
            alert('Folder access failed: ' + err.message);
          }
        }
      } else {
        picker.click();
      }
    });

    picker.addEventListener('change', async e => {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      stopMonitoring();
      await loadFiles(files.map(f => ({ rel: normPath(f.webkitRelativePath), handle: f })));
    });

    /* ---------- Loading ---------- */

    async function loadFiles(raw) {
      allFiles = raw
        .filter(f => isRelevant(f.rel) && groupOf(f.rel))
        .sort((a, b) => a.rel.localeCompare(b.rel));
      paneCache.clear();
      fileState.clear();
      currentRel = null;
      currentKey = null;
      buildChangeMeta();
      renderList();
      updateStats();
      await autoOpenFirst();
    }

    async function autoOpenFirst() {
      const first = allFiles.find(f =>
        groupOf(f.rel) === 'Changes' && f.rel.endsWith('/proposal.md'))
        || allFiles.find(f => groupOf(f.rel) === 'Changes')
        || allFiles[0];
      if (first) await openFile(first.rel);
    }

    function updateStats() {
      const active = [...new Set(allFiles
        .filter(f => groupOf(f.rel) === 'Changes')
        .map(f => changeOf(f.rel)))].length;
      const archived = [...changeMeta.values()].filter(m => isArchived(m.key)).length;
      statsEl.innerHTML = `<b>${allFiles.length}</b> file${allFiles.length === 1 ? '' : 's'} · ` +
        `<b>${active}</b> active change${active === 1 ? '' : 's'} · <b>${archived}</b> archived` +
        (dirHandle ? ' · <span class="live-dot">● live</span>' : '');
    }

    /* ---------- Live monitoring ---------- */

    async function startMonitoring(handle) {
      dirHandle = handle;
      await scan();
      if (!currentRel) await autoOpenFirst();
      clearInterval(pollTimer);
      pollTimer = setInterval(scan, 30000);
    }

    function stopMonitoring() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      dirHandle = null;
    }

    async function* walkDir(dir, prefix) {
      for await (const entry of dir.values()) {
        if (entry.kind === 'directory') {
          yield* walkDir(entry, prefix + entry.name + '/');
        } else {
          yield [prefix + entry.name, entry];
        }
      }
    }

    async function scan() {
      if (!dirHandle || isScanning) return;
      isScanning = true;
      try {
        const current = new Map();
        for await (const root of dirHandle.values()) {
          const rel0 = normPath(root.name);
          if (root.kind === 'directory') {
            // normPath can collapse the picked 'openspec' dir to ''; join without
            // a leading slash so startsWith('changes/') checks still match.
            const prefix = rel0 ? rel0 + '/' : '';
            for await (const [rel, handle] of walkDir(root, prefix)) {
              if (!isRelevant(rel) || !groupOf(rel)) continue;
              const file = await handle.getFile();
              current.set(rel, { handle, lastModified: file.lastModified });
            }
          } else {
            if (!isRelevant(rel0) || !groupOf(rel0)) continue;
            const file = await root.getFile();
            current.set(rel0, { handle: root, lastModified: file.lastModified });
          }
        }

        let changed = false;
        let activeChanged = false;
        for (const [rel, info] of current) {
          const prev = fileState.get(rel);
          if (!prev) changed = true;
          else if (prev.lastModified !== info.lastModified) {
            changed = true;
            paneCache.delete(rel);
            if (rel === currentRel) activeChanged = true;
          }
        }
        for (const rel of fileState.keys()) {
          if (!current.has(rel)) { changed = true; paneCache.delete(rel); }
        }

        // The file currently open was deleted.
        if (currentRel && !fileState.has(currentRel) && !current.has(currentRel)) {
          contentEl.innerHTML = '<div class="empty" style="margin-top:2rem">The open file was deleted while monitoring.</div>';
          currentRel = null;
          currentKey = null;
        }

        fileState.clear();
        current.forEach((v, k) => fileState.set(k, v));

        if (changed && fileState.size) {
          allFiles = [...fileState.entries()]
            .map(([rel, info]) => ({ rel, handle: info.handle }))
            .sort((a, b) => a.rel.localeCompare(b.rel));
          buildChangeMeta();
          renderList();
          updateStats();
          if (activeChanged) await rerenderCurrent();
        }
      } finally {
        isScanning = false;
      }
    }

    async function rerenderCurrent() {
      if (currentKey) await openChange(currentKey, currentRel);
      else if (currentRel) await openFile(currentRel);
    }

    /* ---------- Sidebar list ---------- */

    // Archive is collapsed by default on first visit; afterwards the user's
    // choices persist (stored value is '[]' once they expand it).
    let storedCollapsed = null;
    try { storedCollapsed = localStorage.getItem('osviewer.collapsed'); } catch (e) {}
    const collapsed = new Set(storedCollapsed === null ? ['Archive'] : safeParse(storedCollapsed));

    function safeParse(v) {
      try { const a = JSON.parse(v); return Array.isArray(a) ? a : []; } catch (e) { return []; }
    }

    function toggleGroup(g) {
      if (collapsed.has(g)) collapsed.delete(g); else collapsed.add(g);
      try { localStorage.setItem('osviewer.collapsed', JSON.stringify([...collapsed])); } catch (e) {}
      renderList();
    }

    function renderList() {
      const q = searchEl.value.trim().toLowerCase();
      const forceOpen = q.length > 0; // searching always expands groups

      const sections = [];
      for (const g of GROUPS) {
        if (g === 'Archive' || g === 'Changes') {
          // One row per change (active or archived), labeled with its name.
          const keys = [...new Set(allFiles
            .filter(f => groupOf(f.rel) === g)
            .map(f => changeOf(f.rel)))];
          const rows = keys.map(k => changeMeta.get(k))
            .filter(m => m && (!q || (m.label + ' ' + m.dir + ' ' + m.key).toLowerCase().includes(q)));
          if (rows.length) sections.push({ g, rows });
        } else {
          const items = allFiles.filter(f => {
            if (groupOf(f.rel) !== g) return false;
            if (q && !f.rel.toLowerCase().includes(q)) return false;
            return true;
          });
          if (items.length) sections.push({ g, items });
        }
      }

      let html = sections.length ? '' : '<div class="empty">No artifacts found.</div>';

      sections.forEach(sec => {
        const g = sec.g;
        const items = sec.items || sec.rows;
        const isCollapsed = collapsed.has(g) && !forceOpen;
        const stickyCls = g === 'Changes' ? ' sticky' : '';
        html += `
          <div class="group-label g-${g.toLowerCase()}${stickyCls}${isCollapsed ? ' collapsed' : ''}" data-group="${esc(g)}">
            <span class="chevron">▾</span>
            <span class="group-name">${esc(g)}</span>
            <span class="group-count">${items.length}</span>
          </div>`;
        if (!isCollapsed) {
          if (g === 'Archive' || g === 'Changes') {
            sec.rows.forEach(m => {
              const active = m.key === currentKey;
              html += `<div class="item change-row${active ? ' active' : ''}" data-key="${esc(m.key)}">
                <span class="path">${esc(m.label)}</span>
                ${m.date ? `<span class="date">${esc(m.date)}</span>` : ''}
              </div>`;
            });
          } else {
            sec.items.forEach(f => {
              const active = f.rel === currentRel;
              // Specs/Config sections need no badge — the section color says it.
              const badge = (g === 'Specs' || g === 'Config') ? '' :
                `<span class="badge ${artifactOf(f.rel).toLowerCase()}">${esc(artifactOf(f.rel))}</span>`;
              html += `<div class="item${active ? ' active' : ''}" data-rel="${esc(f.rel)}">
                <span class="path">${esc(displayLabel(f.rel, g))}</span>
                ${badge}
              </div>`;
            });
          }
        }
      });

      listEl.innerHTML = html;
      listEl.querySelectorAll('.group-label').forEach(el =>
        el.addEventListener('click', () => toggleGroup(el.dataset.group)));
      listEl.querySelectorAll('.item[data-rel]').forEach(el =>
        el.addEventListener('click', () => openFile(el.dataset.rel)));
      listEl.querySelectorAll('.item[data-key]').forEach(el =>
        el.addEventListener('click', () => openChange(el.dataset.key)));
    }

    searchEl.addEventListener('input', renderList);
    document.addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement !== searchEl) {
        e.preventDefault();
        searchEl.focus();
      }
      if (e.key === 'Escape' && document.activeElement === searchEl) {
        searchEl.value = '';
        renderList();
        searchEl.blur();
      }
    });

    /* ---------- Rendering ---------- */

    function crumbFor(rel) {
      let segs = rel.split('/');
      // Spec files: show the capability path, not a trailing spec.md.
      if (segs.length > 1 && segs[segs.length - 1] === 'spec.md') segs = segs.slice(0, -1);
      return segs.map((seg, i) =>
        i === segs.length - 1
          ? `<span class="file">${esc(seg)}</span>`
          : `<span class="seg">${esc(seg)}</span><span class="sep">/</span>`).join('');
    }

    async function paneHtml(rel) {
      if (paneCache.has(rel)) return paneCache.get(rel);
      const entry = allFiles.find(f => f.rel === rel);
      if (!entry) return '<div class="empty">File not found.</div>';
      const f = entry.handle;
      // FileSystemFileHandle re-reads the live file; a plain File is a one-shot snapshot.
      const text = typeof f.getFile === 'function' ? await (await f.getFile()).text() : await f.text();
      const name = rel.split('/').pop();
      const html = (name.endsWith('.yaml') || name.endsWith('.yml'))
        ? yamlPane(text) : markdownPane(rel, text);
      paneCache.set(rel, html);
      return html;
    }

    // A change artifact (proposal/spec/design/tasks/metadata) opens the whole
    // change in a tabbed view instead of a single file.
    async function openFile(rel) {
      const entry = allFiles.find(f => f.rel === rel);
      if (!entry) return;
      const key = changeOf(rel);
      if (key) { openChange(key, rel); return; }
      currentRel = rel;
      currentKey = null;
      renderList();
      contentEl.innerHTML = `<div class="crumb">${crumbFor(rel)}</div>${await paneHtml(rel)}`;
      contentEl.scrollTop = 0;
    }

    async function openChange(key, initialRel) {
      const meta = changeMeta.get(key);
      if (!meta) return;
      currentKey = key;
      currentRel = initialRel || meta.proposalRel || null;
      renderList();

      // Tabs in order: proposal, specs…, design, tasks, metadata
      const tabs = [];
      const push = (rel, label) => { if (rel) tabs.push({ rel, label }); };
      const prop = meta.files.find(f => f.rel.endsWith('/proposal.md'));
      const specs = meta.files
        .filter(f => f.rel.includes('/specs/') && f.rel.endsWith('spec.md'))
        .sort((a, b) => a.rel.localeCompare(b.rel));
      const design = meta.files.find(f => f.rel.endsWith('/design.md'));
      const tasks = meta.files.find(f => f.rel.endsWith('/tasks.md'));
      const metaYaml = meta.files.find(f => f.rel.endsWith('.openspec.yaml'));
      push(prop && prop.rel, 'Proposal');
      specs.forEach(s => {
        const cap = s.rel.slice(s.rel.indexOf('/specs/') + 1)
          .replace(/^specs\//, '').replace(/\/spec\.md$/, '');
        push(s.rel, specs.length === 1 ? 'Spec' : `Spec · ${cap}`);
      });
      push(design && design.rel, 'Design');
      push(tasks && tasks.rel, 'Tasks');
      push(metaYaml && metaYaml.rel, 'Metadata');
      currentTabs = tabs;

      const tabBar = tabs.map((t, i) =>
        `<button class="tab ${artifactOf(t.rel).toLowerCase()}${t.rel === currentRel ? ' active' : ''}" data-i="${i}">${esc(t.label)}</button>`).join('');

      contentEl.innerHTML = `
        <div class="crumb">${crumbFor(meta.key)}</div>
        <div class="change-head">
          <h2>${esc(meta.label)}</h2>
          ${meta.date ? `<span class="date-badge">${esc(meta.date)}</span>` : ''}
          <span class="path-sub">${esc(meta.dir)}</span>
        </div>
        <div class="tabs">${tabBar}</div>
        <div id="tab-panes" class="pane-loading">Loading…</div>`;

      contentEl.querySelectorAll('.tab').forEach(btn =>
        btn.addEventListener('click', () => activateTab(+btn.dataset.i)));

      const start = Math.max(0, tabs.findIndex(t => t.rel === currentRel));
      await activateTab(start);
    }

    async function activateTab(i) {
      const t = currentTabs[i];
      if (!t) return;
      currentRel = t.rel;
      contentEl.querySelectorAll('.tab').forEach(b =>
        b.classList.toggle('active', +b.dataset.i === i));
      const panes = contentEl.querySelector('#tab-panes');
      panes.className = '';
      panes.innerHTML = await paneHtml(t.rel);
      contentEl.scrollTop = 0;
      renderList();
    }

    function yamlPane(text) {
      let card = '';
      try {
        const data = jsyaml.load(text);
        if (data && typeof data === 'object') {
          card = metaCard(Object.entries(data).map(([k, v]) =>
            [k, v === null ? 'null' : typeof v === 'object' ? JSON.stringify(v, null, 2) : String(v)]));
        }
      } catch (err) {
        card = `<div class="meta-error">YAML parse failed: ${esc(err.message)}</div>`;
      }
      return `${card}<pre class="yaml-view">${esc(text)}</pre>`;
    }

    function markdownPane(rel, text) {
      const { meta, body } = parseFrontmatter(text);

      let metaHtml = '';
      if (meta && typeof meta === 'object' && !meta._error) {
        const rows = Object.entries(meta).map(([k, v]) =>
          `<tr><td>${esc(k)}</td><td>${
            v === null || v === undefined ? '' :
            typeof v === 'object' ? `<pre class="yaml-view" style="padding:6px">${esc(JSON.stringify(v, null, 2))}</pre>` :
            esc(String(v))}</td></tr>`).join('');
        metaHtml = `<div class="meta-card"><h3>${esc(artifactOf(rel))} metadata</h3><table class="meta-table">${rows}</table></div>`;
      } else if (meta && meta._error) {
        metaHtml = `<div class="meta-card"><h3>Frontmatter</h3><div class="meta-error">Could not parse: ${esc(meta._error)}</div></div>`;
      }

      // Tasks progress
      const tasks = body.match(/^\s*[-*]\s+\[([ xX])\]/gm) || [];
      let progressHtml = '';
      if (tasks.length) {
        const done = tasks.filter(t => /\[[xX]\]/.test(t)).length;
        const pct = Math.round(done / tasks.length * 100);
        progressHtml = `<div class="progress">${done}/${tasks.length} tasks done · ${pct}%</div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>`;
      }

      const safe = DOMPurify.sanitize(marked.parse(body, { breaks: true })
        .replace(/<li>\[([ xX])\]\s*</g, (m, s) =>
          `<li class="task-${(s === 'x' || s === 'X') ? 'done' : 'open'}"><input type="checkbox" ${s !== ' ' ? 'checked' : ''} disabled>`));

      return `${progressHtml}
        ${metaHtml}
        <div class="markdown">${safe}</div>`;
    }

    function parseFrontmatter(text) {
      const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
      if (!m) return { meta: null, body: text };
      let meta = null;
      try { meta = jsyaml.load(m[1]); } catch (e) { meta = { _error: e.message }; }
      return { meta, body: text.slice(m[0].length) };
    }

    function metaCard(rows) {
      return `<div class="meta-card"><h3>Metadata</h3><table class="meta-table">${
        rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')}</table></div>`;
    }

    // Welcome state
    contentEl.innerHTML = `
      <div class="welcome">
        <div class="icon">📋</div>
        <h2>OpenSpec Local Viewer</h2>
        <p>Choose your repository folder (or the <code>openspec/</code> folder) to browse
        change proposals, designs, task lists, and specs.</p>
        <p>Everything stays on your machine; files are read with the File API and never uploaded.</p>
      </div>`;
  </script>
</body>
</html>
