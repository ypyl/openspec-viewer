<!DOCTYPE html>
<!-- OpenSpec Local Viewer v1.10.1 -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSpec Local Viewer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d1117">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script src="https://cdn.jsdelivr.net/npm/marked@18/lib/marked.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --border-muted: #21262d;
      --fg: #c9d1d9;
      --fg-muted: #8b949e;
      --fg-subtle: #6e7681;
      --accent: #58a6ff;
      --accent-dim: #1f6feb;
      --green: #3fb950;
      --purple: #bc8cff;
      --orange: #d29922;
      --red: #f85149;
      --pink: #f778ba;
      --code-bg: #0d1117;
      --scroll-thumb: #484f58;
      --radius: 6px;
      color-scheme: dark;
    }
    /* GitHub-light palette */
    :root[data-theme="light"] {
      --bg: #ffffff;
      --panel: #f6f8fa;
      --border: #d0d7de;
      --border-muted: #d8dee4;
      --fg: #1f2328;
      --fg-muted: #59636e;
      --fg-subtle: #818b98;
      --accent: #0969da;
      --accent-dim: #0969da;
      --green: #1a7f37;
      --purple: #8250df;
      --orange: #9a6700;
      --red: #cf222e;
      --pink: #bf3989;
      --code-bg: #f6f8fa;
      --scroll-thumb: #c8d1d9;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      font-size: 14px;
      line-height: 1.6;
    }

    /* ---------- Header ---------- */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    header h1 .dot { color: var(--accent); }
    .version {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
      border-radius: 20px;
      padding: 1px 8px;
      letter-spacing: .4px;
      margin-left: 2px;
    }
    .theme-btn {
      margin-left: 8px;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: background .15s;
    }
    .theme-btn:hover { background: var(--panel); }
    #stats { font-size: 12px; color: var(--fg-muted); margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #stats b { color: var(--fg); font-weight: 600; }

    /* ---------- Layout ---------- */
    /* Mobile-first: base styles are the stacked layout; min-width media
       queries below progressively restore the two-pane desktop layout.
       Breakpoints follow Mantine defaults (em): xs=36em sm=48em md=62em
       lg=75em xl=88em. */
    .layout { display: flex; flex-direction: column; flex: 1; min-height: 0; }

    aside {
      width: 100%;
      max-height: 42vh;
      flex-shrink: 0;
      background: var(--panel);
      border-right: none;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    main {
      flex: 1;
      overflow-y: auto;
      /* Reserve vertical scrollbar space always so short/long tab content
         doesn't cause the page to jump when the scrollbar appears/disappears. */
      scrollbar-gutter: stable;
      padding: 16px;
      min-width: 0;
      min-height: 0;
    }
    /* Cap the content column at a readable width and center it on wide screens. */
    main > * {
      max-width: 980px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ---------- Sidebar controls ---------- */
    .controls { padding: 12px; border-bottom: 1px solid var(--border-muted); display: flex; flex-direction: column; gap: 10px; }
    .pick-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--accent-dim);
      color: #fff;
      border: 1px solid rgba(240,246,252,.1);
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s;
    }
    .pick-btn:hover { background: #2a6fd9; }
    #picker { display: none; }
    .search-row { position: relative; display: flex; align-items: center; }
    .search-row svg {
      position: absolute; left: 10px; pointer-events: none;
      color: var(--fg-subtle); width: 14px; height: 14px;
    }
    #search {
      width: 100%;
      padding: 7px 10px 7px 30px;
      background: var(--bg);
      border: 1px solid var(--border-muted);
      border-radius: var(--radius);
      color: var(--fg);
      font-size: 13px;
      outline: none;
    }
    #search:focus { border-color: var(--accent-dim); box-shadow: 0 0 0 3px rgba(31,111,235,.3); }
    #search::placeholder { color: var(--fg-subtle); }

    /* ---------- File list ---------- */
    #file-list { flex: 1; overflow-y: auto; scrollbar-gutter: stable; padding: 8px 0; }
    .group-label {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px 8px 14px;
      cursor: pointer;
      user-select: none;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--gc, var(--fg-subtle));
      border-top: 1px solid var(--border-muted);
      transition: color .12s, background .12s;
    }
    .group-label.sticky {
      position: sticky;
      top: 0;
      background: var(--panel);
      z-index: 2;
    }
    .group-label:hover { color: var(--gc, var(--fg)); background: rgba(110,118,129,.06); }
    .group-label .chevron {
      font-size: 9px;
      color: var(--gc, var(--fg-subtle));
      display: inline-block;
      transition: transform .12s;
    }
    .group-label.collapsed .chevron { transform: rotate(-90deg); }
    .group-label .group-name { flex: 1; }
    .group-label.g-changes { --gc: var(--accent); }
    .group-label.g-archive { --gc: var(--purple); }
    .group-label.g-specs   { --gc: var(--green); }
    .group-label.g-config  { --gc: var(--orange); }
    .group-count {
      font-size: 10px;
      font-weight: 600;
      color: var(--gc, var(--fg-subtle));
      background: color-mix(in srgb, var(--gc, var(--fg-subtle)) 12%, transparent);
      border-radius: 10px;
      padding: 0 7px;
      line-height: 16px;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 14px;
      cursor: pointer;
      color: var(--fg-muted);
      border-left: 2px solid transparent;
      word-break: break-all;
    }
    .item:hover { background: rgba(110,118,129,.1); color: var(--fg); }
    .item.active { background: rgba(31,111,235,.15); border-left-color: var(--accent); color: var(--fg); }
    .item .path { font-size: 12.5px; }
    .item.active .path { color: var(--fg); }
    .badge {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .4px;
      padding: 1px 6px;
      border-radius: 20px;
      border: 1px solid var(--border);
      color: var(--fg-muted);
    }
    .badge.proposal { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
    .badge.design   { color: var(--purple); border-color: color-mix(in srgb, var(--purple) 45%, transparent); }
    .badge.tasks    { color: var(--orange); border-color: color-mix(in srgb, var(--orange) 45%, transparent); }
    .badge.spec     { color: var(--green);  border-color: color-mix(in srgb, var(--green) 45%, transparent); }
    .badge.metadata { color: var(--pink);   border-color: color-mix(in srgb, var(--pink) 45%, transparent); }
    .badge.config   { color: var(--fg);     border-color: var(--border); }
    .cmt-count {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 700;
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      color: var(--accent);
      border-radius: 10px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .empty {
      padding: 24px 14px;
      text-align: center;
      color: var(--fg-subtle);
      font-size: 13px;
    }
    .live-dot { color: var(--green); font-weight: 600; }

    /* ---------- Recent-change highlighting ---------- */
    .item.new { background: color-mix(in srgb, var(--green) 9%, transparent); }
    .item.new:hover { background: color-mix(in srgb, var(--green) 16%, transparent); }
    .new-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 22%, transparent);
    }
    .group-new {
      font-size: 10px;
      font-weight: 600;
      color: var(--green);
      text-transform: none;
      letter-spacing: 0;
    }
    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 90;
      border-left: 3px solid var(--green);
      background: color-mix(in srgb, var(--green) 12%, var(--panel));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 16px;
      color: var(--fg);
      font-size: 13px;
      box-shadow: 0 8px 30px rgba(0,0,0,.35);
      animation: toast-in .25s ease-out;
    }
    /* Keep the toast clear of the open review drawer (360px) so it never
       covers the Copy fix prompt / Send to LLM buttons. */
    body:has(.review-drawer.open) .toast {
      right: 376px;
    }
    .toast.error {
      border-left-color: var(--red);
      background: color-mix(in srgb, var(--red) 12%, var(--panel));
    }
    @keyframes toast-in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

    /* ---------- Main content ---------- */
    .crumb {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12.5px;
      color: var(--fg-muted);
      margin-bottom: 16px;
    }
    .crumb .seg { color: var(--accent); text-decoration: none; }
    .crumb .sep { color: var(--fg-subtle); }
    .crumb .file { color: var(--fg); font-weight: 500; word-break: break-all; }
    .meta-card {
      background: var(--panel);
      border: 1px solid var(--border-muted);
      border-left: 3px solid var(--accent-dim);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 20px;
      font-size: 13px;
    }
    .meta-card h3 {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--fg-subtle);
    }
    .meta-table { width: 100%; border-collapse: collapse; }
    .meta-table td { padding: 3px 8px 3px 0; vertical-align: top; }
    .meta-table td:first-child {
      width: 130px;
      color: var(--fg-muted);
      white-space: nowrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }
    .meta-table td:last-child { color: var(--fg); word-break: break-word; }
    .meta-error { color: var(--red); font-size: 12px; }
    .progress { margin: 6px 0 2px; }
    .progress-track {
      height: 6px;
      background: var(--border-muted);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-fill {
      height: 100%;
      background: var(--green);
      border-radius: 3px;
      transition: width .3s;
    }

    .pane-loading { color: var(--fg-subtle); padding: 10px 0; }

    /* ---------- Loading overlay ---------- */
    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: color-mix(in srgb, var(--bg) 60%, transparent);
      backdrop-filter: blur(2px);
    }
    .loading-overlay[hidden] { display: none; }
    .loading-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 8px 30px rgba(0,0,0,.4);
      color: var(--fg);
      font-size: 13.5px;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border-muted);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- Change tabs ---------- */
    .change-head {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .change-head h2 { margin: 0; font-size: 20px; color: var(--fg); }
    .change-head .date-badge {
      font-size: 11px;
      color: var(--fg-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      border: 1px solid var(--border-muted);
      border-radius: 12px;
      padding: 1px 8px;
    }
    .tabs {
      display: flex;
      gap: 2px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .tab {
      padding: 7px 14px;
      background: transparent;
      color: var(--tabc, var(--fg-muted));
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: var(--radius) var(--radius) 0 0;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    .tab:hover { color: var(--tabc, var(--fg)); background: rgba(110,118,129,.08); }
    .tab.active { color: var(--tabc, var(--accent)); border-bottom-color: var(--tabc, var(--accent)); background: rgba(110,118,129,.12); }
    .tab.proposal { --tabc: var(--accent); }
    .tab.design   { --tabc: var(--purple); }
    .tab.tasks    { --tabc: var(--orange); }
    .tab.spec     { --tabc: var(--green); }
    .tab.metadata { --tabc: var(--pink); }
    .tab.config   { --tabc: var(--fg); }

    /* ---------- Archive rows ---------- */
    .item .date {
      margin-left: auto;
      font-size: 11px;
      color: var(--fg-subtle);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      flex-shrink: 0;
    }

    /* ---------- Markdown content ---------- */
    .markdown h1, .markdown h2, .markdown h3, .markdown h4 {
      border-bottom: 1px solid var(--border-muted);
      padding-bottom: .3em;
      margin-top: 1.5em;
      font-weight: 600;
      line-height: 1.25;
    }
    .markdown h1 { font-size: 1.7em; }
    .markdown h2 { font-size: 1.4em; }
    .markdown h3 { font-size: 1.15em; }
    .markdown h4 { font-size: 1em; }
    .markdown a { color: var(--accent); text-decoration: none; }
    .markdown a:hover { text-decoration: underline; }
    .markdown code {
      background: rgba(110,118,129,.2);
      border-radius: 4px;
      padding: .1em .35em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 85%;
    }
    .markdown pre {
      background: var(--code-bg);
      border: 1px solid var(--border-muted);
      border-radius: var(--radius);
      padding: 14px;
      overflow-x: auto;
      line-height: 1.45;
    }
    .markdown pre code { background: none; padding: 0; font-size: 12.5px; }
    .markdown blockquote {
      margin: 0 0 16px;
      padding: 0 1em;
      border-left: .25em solid var(--border);
      color: var(--fg-muted);
    }
    .markdown table {
      border-collapse: collapse;
      display: block;
      max-width: 100%;
      overflow: auto;
      margin: 16px 0;
    }
    .markdown table th, .markdown table td {
      border: 1px solid var(--border-muted);
      padding: 6px 13px;
    }
    .markdown table th { background: var(--panel); font-weight: 600; }
    .markdown img { max-width: 100%; }
    .markdown hr { border: none; border-top: 1px solid var(--border-muted); margin: 24px 0; }
    .markdown li.task-done { color: var(--fg-subtle); }
    .markdown li.task-done input { opacity: .5; }

    /* ---------- Welcome ---------- */
    .welcome {
      max-width: 560px;
      margin: 80px auto;
      text-align: center;
      color: var(--fg-muted);
    }
    .welcome .icon { font-size: 44px; }
    .welcome h2 { color: var(--fg); font-size: 20px; margin: 12px 0 8px; }
    .welcome p { font-size: 13.5px; line-height: 1.7; }
    .welcome code { background: rgba(110,118,129,.2); border-radius: 4px; padding: .1em .35em; font-size: 12.5px; }

    /* ---------- YAML / raw ---------- */
    .yaml-view {
      background: var(--code-bg);
      border: 1px solid var(--border-muted);
      border-radius: var(--radius);
      padding: 16px;
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ---------- Diff view (content change detection) ---------- */
    .diff {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      margin-bottom: 20px;
      overflow: hidden;
    }
    .diff summary {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      cursor: pointer;
      user-select: none;
      font-size: 12.5px;
      font-weight: 600;
      list-style: none;
    }
    .diff summary::-webkit-details-marker { display: none; }
    .diff summary::before { content: '▸'; color: var(--fg-subtle); transition: transform .12s; }
    .diff[open] summary::before { transform: rotate(90deg); }
    .diff summary:hover { background: rgba(110,118,129,.06); }
    .diff-ts { margin-left: auto; font-weight: 400; font-size: 11px; color: var(--fg-subtle); }
    .dh-add { color: var(--green); font-size: 11px; font-weight: 700; }
    .dh-del { color: var(--red); font-size: 11px; font-weight: 700; }
    .diff-view {
      margin: 0;
      padding: 4px 0 8px;
      border-top: 1px solid var(--border-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px;
      line-height: 1.55;
      overflow-x: auto;
    }
    .diff-line { display: flex; white-space: pre-wrap; word-break: break-word; }
    .diff-line .ln {
      flex-shrink: 0;
      width: 3.2em;
      text-align: right;
      padding: 0 8px;
      color: var(--fg-subtle);
      user-select: none;
    }
    .diff-line .sign { flex-shrink: 0; width: 1.4em; text-align: center; color: var(--fg-subtle); user-select: none; }
    .diff-line .code { flex: 1; padding: 0 10px 0 4px; }
    .diff-line.del .code { background: color-mix(in srgb, var(--red) 13%, transparent); }
    .diff-line.add .code { background: color-mix(in srgb, var(--green) 13%, transparent); }
    .diff-line.del .sign { color: var(--red); }
    .diff-line.add .sign { color: var(--green); }
    .diff-line.hdr .ln, .diff-line.hdr .sign { color: var(--accent); }
    .diff-line.hdr .code {
      color: var(--fg-muted);
      background: color-mix(in srgb, var(--accent) 9%, transparent);
    }
    .diff-hint { flex-shrink: 0; font-size: 10.5px; display: inline-flex; gap: 4px; }

    /* ---------- Review: highlights & comments ---------- */
    /* mark.hl wraps commented text as an invisible anchor for scroll-to-focus;
       no background so the file reads cleanly. */
    mark.hl {
      background: transparent;
      color: inherit;
    }
    mark.hl.active { outline: 2px solid var(--accent); }

    .review-btn {
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      height: 30px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-size: 13px;
      transition: background .15s;
    }
    .review-btn:hover { background: var(--panel); }
    .review-btn.active { border-color: var(--accent); color: var(--accent); }
    .review-count {
      font-size: 10px;
      font-weight: 700;
      background: var(--accent-dim);
      color: #fff;
      border-radius: 10px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .review-count[hidden] { display: none; }

    .ann-bubble {
      position: fixed;
      z-index: 70;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 8px 30px rgba(0,0,0,.4);
      max-width: min(960px, calc(100vw - 16px));

    // ---------- Plain Vanilla Web libs (vendored, no build step) ----------
    // html-literal, tiny-signals, tiny-context by jsebrech (https://plainvanillaweb.com).
    // Classic script (not ES modules) so the app still runs from file://.
    (function () {
      // html-literal: tagged template that entity-encodes interpolations.
      class Html extends String { }
      const htmlRaw = str => new Html(str);
      const htmlEncode = (value) => {
        if (value instanceof Html) return value;   // avoid double-encoding
        return htmlRaw(String(value).replace(/[&<>"']/g,
          tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])));
      };
      const html = (strings, ...values) =>
        htmlRaw(String.raw({ raw: strings }, ...values.map(htmlEncode)));

      // tiny-signals: minimal reactive state.
      class Signal extends EventTarget {
        #value;
        get value() { return this.#value; }
        set value(value) {
          if (this.equals(value)) return;
          this.#value = value;
          this.dispatchEvent(new CustomEvent('change'));
        }
        constructor(value) { super(); this.#value = value; }
        equals(value) { return this.#value === value; }
        effect(fn) {
          fn();
          this.addEventListener('change', fn);
          return () => this.removeEventListener('change', fn);
        }
        valueOf() { return this.#value; }
        toString() { return String(this.#value); }
      }
      class Computed extends Signal {
        constructor(fn, deps) {
          super(fn(...deps));
          for (const dep of deps) {
            if (dep instanceof Signal)
              dep.addEventListener('change', () => { this.value = fn(...deps); });
          }
        }
      }
      const signal = _ => new Signal(_);
      const computed = (fn, deps) => new Computed(fn, deps);

      // tiny-context: web components context protocol.
      // Dormant for now: nothing crosses a component boundary in this
      // single-file app; wire it up when UI is extracted into custom elements.
      class ContextRequestEvent extends Event {
        constructor(context, callback, subscribe) {
          super('context-request', { bubbles: true, composed: true });
          this.context = context;
          this.callback = callback;
          this.subscribe = subscribe;
        }
      }
      class ContextProvider extends EventTarget {
        #value; #context;
        get value() { return this.#value; }
        set value(v) { this.#value = v; this.dispatchEvent(new Event('change')); }
        get context() { return this.#context; }
        constructor(target, context, initialValue = undefined) {
          super();
          this.#context = context;
          this.#value = initialValue;
          if (target) this.attach(target);
        }
        attach(target) { target.addEventListener('context-request', this); }
        detach(target) { target.removeEventListener('context-request', this); }
        handleEvent(e) {
          if (e.context === this.context) {
            if (e.subscribe) {
              const unsubscribe = () => this.removeEventListener('change', update);
              const update = () => e.callback(this.value, unsubscribe);
              this.addEventListener('change', update);
              update();
            } else {
              e.callback(this.value);
            }
            e.stopPropagation();
          }
        }
      }

      window.PV = { html, htmlEncode, htmlRaw, signal, computed, ContextProvider, ContextRequestEvent };
    })();

  <script>
    'use strict';

    const { html, htmlRaw, signal, computed } = window.PV;
    // joinHtml: concatenate an array of html`` fragments into one safe chunk.
    // A plain .join('') would lose the Html marker and get re-encoded on

    const joinHtml = parts => htmlRaw(parts.join(''));

    const picker = document.getElementById('picker');

    const searchEl = document.getElementById('search');

    const contentEl = document.getElementById('content');

    const loadingEl = document.getElementById('loading');

      loadingEl.hidden = !msg;
    }

    const reviewBtn = document.getElementById('review-btn');
    const reviewEl = document.getElementById('review');
    const reviewCountEl = document.getElementById('review-count');
    const reviewFileEl = document.getElementById('review-file');
    const reviewListEl = document.getElementById('review-list');
    const copyPromptBtn = document.getElementById('copy-prompt-btn');
    const sendLlmBtn = document.getElementById('send-llm-btn');
    const promptModal = document.getElementById('prompt-modal');
    const promptTextEl = document.getElementById('prompt-text');

    let toastTimer = null;
    function showToast(msg, type) {
      const old = document.querySelector('.toast');
      if (old) old.remove();
      const t = document.createElement('div');
      t.className = 'toast' + (type === 'error' ? ' error' : '');
      t.textContent = msg;
      document.body.appendChild(t);
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.remove(), 5000);
    }

    // ---------- Theme ----------
    // 'dark' | 'light' | 'system' — system follows the OS via prefers-color-scheme.
    const theme = signal('system');
    try {
      const t = localStorage.getItem('osviewer.theme');
      if (t === 'dark' || t === 'light') theme.value = t;
    } catch (e) {}

    const mql = window.matchMedia('(prefers-color-scheme: dark)');
    function resolved() {
      return theme.value === 'system' ? (mql.matches ? 'dark' : 'light') : theme.value;
    }
    function applyTheme() {
      document.documentElement.dataset.theme = resolved();
      const icons = { dark: '☀️', light: '🌙', system: '💻' };
      const titles = {
        dark: 'Switch to light theme',
        light: 'Switch to dark theme',
        system: 'Following system theme — click to override',
      };
      themeBtn.textContent = icons[theme.value];
      themeBtn.title = titles[theme.value];
      try { localStorage.setItem('osviewer.theme', theme.value); } catch (e) {}
    }
    // Click cycles: dark -> light -> system -> dark
    const cycle = { dark: 'light', light: 'system', system: 'dark' };
    themeBtn.addEventListener('click', () => { theme.value = cycle[theme.value]; });
    mql.addEventListener('change', () => { if (theme.value === 'system') applyTheme(); });
    theme.effect(applyTheme);

    // ---- Reactive state (tiny-signals). Mutating these re-renders via computed/effect. ----
    const allFiles = signal([]);    // [{ rel, handle }] handle = FileSystemFileHandle (monitored) or File (one-shot)
    const currentRel = signal(null);
    const currentKey = signal(null);       // selected change (active or archived)
    const dirHandle = signal(null);        // FileSystemDirectoryHandle being monitored
    const recentRels = signal(new Set());  // rels added/updated since the last scan, not yet opened
    let storedCollapsed = null;
    try { storedCollapsed = localStorage.getItem('osviewer.collapsed'); } catch (e) {}
    const collapsed = signal(new Set(storedCollapsed === null ? ['Archive'] : safeParse(storedCollapsed)));
    const search = signal('');
    const highlights = signal(new Map());  // rel -> [{ id, start, end, text, comment, ts, rel, lines }]
    const staleTick = signal(0);           // bumped after a file renders so stale checks re-run on the right content

    let currentTabs = [];         // tabs in the open change view (imperative, not reactive)
    let storePrefix = '';         // project path prefix, e.g. 'llmclip/openspec/' or 'openspec/'
    let pollTimer = null;         // setInterval id for the poll loop
    let isScanning = false;       // guard against overlapping scans
    const fileState = new Map();  // rel -> { handle, lastModified } snapshot for change detection
    const paneCache = new Map();  // rel -> rendered pane HTML
    const diffInfo = new Map();   // rel -> { hunks, added, removed, ts } line diff vs last snapshot
    const freshDiffs = new Set(); // rels whose diff came from the latest scan; never cleared —
                                  // auto-open applies at first render only, and panes are cached
                                  // afterwards, so the user's open/collapsed choice persists
    const GROUPS = ['Changes', 'Specs', 'Archive', 'Config'];

    /* ---------- Derived state: computed + effects re-render the DOM ---------- */

    const changeMeta = computed(() => {
      const m = new Map();
      const byKey = new Map();
      for (const f of allFiles.value) {
        const key = changeOf(f.rel);
        if (!key) continue;
        if (!byKey.has(key)) byKey.set(key, []);
        byKey.get(key).push(f);
      }
      for (const [key, files] of byKey) {
        const dir = key.split('/').pop();
        const { label, date } = prettyChangeName(dir);
        const proposal = files.find(f => f.rel.endsWith('/proposal.md'));
        m.set(key, { key, dir, label, date, proposalRel: proposal ? proposal.rel : null, files });
      }
      return m;
    }, [allFiles]);

    const stats = computed(() => {
      const all = allFiles.value;
      const active = [...new Set(all.filter(f => groupOf(f.rel) === 'Changes').map(f => changeOf(f.rel)))].length;
      const archived = [...changeMeta.value.values()].filter(m => isArchived(m.key)).length;
      return html`<b>${all.length}</b> file${all.length === 1 ? '' : 's'} · ` +
        html`<b>${active}</b> active change${active === 1 ? '' : 's'} · <b>${archived}</b> archived` +
        (dirHandle.value ? html` · <span class="live-dot">● live</span>` : '');
    }, [allFiles, dirHandle, changeMeta]);
    stats.effect(() => { statsEl.innerHTML = stats.value; });

    const listHtml = computed(buildListHtml, [allFiles, currentRel, currentKey, recentRels, collapsed, search, changeMeta, highlights]);
    listHtml.effect(() => {
      listEl.innerHTML = listHtml.value;
      listEl.querySelectorAll('.group-label').forEach(el =>
        el.addEventListener('click', () => toggleGroup(el.dataset.group)));
      listEl.querySelectorAll('.item[data-rel]').forEach(el =>
        el.addEventListener('click', () => openFile(el.dataset.rel)));
      listEl.querySelectorAll('.item[data-key]').forEach(el =>

    const reviewHtml = computed(buildReviewHtml, [currentRel, highlights, staleTick]);
    reviewHtml.effect(() => {
      const items = allHighlights();
      reviewCountEl.textContent = items.length;
      reviewCountEl.hidden = items.length === 0;
      const files = new Set(items.map(h => h.rel)).size;
      reviewFileEl.textContent = items.length

        : '';
