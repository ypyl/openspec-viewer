      reviewListEl.querySelectorAll('.rv-del').forEach(b =>
        b.addEventListener('click', () => deleteHighlight(b.dataset.rel, b.dataset.id)));
      reviewListEl.querySelectorAll('.rv-item').forEach(item =>
        item.addEventListener('click', e => {
          if (e.target.closest('.rv-del')) return;
          revealComment(item.dataset.rel, item.dataset.id);
        }));
      const hasComments = items.some(h => h.comment);
      copyPromptBtn.disabled = !hasComments;
      sendLlmBtn.disabled = !hasComments;
      const hint = hasComments ? '' : 'Add a comment first';
      copyPromptBtn.title = hint;
      sendLlmBtn.title = hint;
    });

    /* ---------- Path helpers ---------- */

    // Paths come in relative to the picked folder. If the repo root was picked,
    // they start with "openspec/…"; strip any path up to and including the
    // first "openspec" segment so browsing works from either the repo root or
    // the openspec folder itself.
    function normPath(p) {
      const parts = p.split('/');
      const i = parts.indexOf('openspec');
      if (i >= 0) return parts.slice(i + 1).join('/');
      return p;
    }

    function artifactOf(rel) {
      const name = rel.split('/').pop();
      if (name === 'proposal.md') return 'Proposal';
      if (name === 'design.md') return 'Design';
      if (name === 'tasks.md') return 'Tasks';
      if (name === 'config.yaml') return 'Config';
      if (name.endsWith('.openspec.yaml')) return 'Metadata';
      if (name.endsWith('spec.md')) return 'Spec';
      return 'Doc';
    }

    function isRelevant(rel) {
      // .openspec.yaml is a real artifact; other dotfiles (like .gitkeep) are noise.
      return /\.(md|ya?ml|json)$/i.test(rel) &&
        (rel.endsWith('.openspec.yaml') || !rel.split('/').pop().startsWith('.'));
    }

    function isArchived(rel) {
      return rel.startsWith('changes/archive/');
    }

    // Only four sections. Archive lives under changes/archive per the
    // standard openspec CLI layout; everything else is ignored.
    function groupOf(rel) {
      if (rel === 'config.yaml' || rel.startsWith('config/')) return 'Config';
      if (isArchived(rel)) return 'Archive';
      if (rel.startsWith('changes/')) return 'Changes';
      if (rel.startsWith('specs/')) return 'Specs';
      return null;
    }

    function displayLabel(rel, group) {
      if (group === 'Changes') return rel.slice('changes/'.length);                 // <change>/<file…>
      if (group === 'Archive') return rel.slice('changes/archive/'.length);         // <date>-<change>/<file…>
      if (group === 'Specs') return rel.slice('specs/'.length).replace(/\/spec\.md$/, '');  // <capability>
      return rel;                                                                   // config.yaml
    }

    function changeOf(rel) {
      if (isArchived(rel)) return rel.split('/').slice(0, 3).join('/');             // changes/archive/<name>
      if (rel.startsWith('changes/')) return rel.split('/').slice(0, 2).join('/');  // changes/<name>
      return null;
    }

    function prettyChangeName(dir) {
      let n = dir, date = '';
      const m = n.match(/^(\d{4}-\d{2}-\d{2})-(.*)$/);
      if (m) { date = m[1]; n = m[2]; }
      const label = n.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      return { label, date };
    }

    /* ---------- Picker ---------- */

    /* ---------- Remember the last picked folder (IndexedDB) ---------- */

    const IDB_NAME = 'osviewer';
    const IDB_STORE = 'handles';
    const IDB_SNAP = 'snapshots';  // last scan's artifact text, keyed by rel path
    function idbOpen() {
      return new Promise((res, rej) => {
        const req = indexedDB.open(IDB_NAME, 2);
        req.onupgradeneeded = () => {
          // Guard both stores: on a v1->v2 upgrade 'handles' already exists
          // and re-creating it throws ConstraintError, which would abort the
          // upgrade and break handle persistence for returning users.
          const db = req.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
          if (!db.objectStoreNames.contains(IDB_SNAP)) db.createObjectStore(IDB_SNAP, { keyPath: 'rel' });
        };
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      });
    }
    async function saveHandle(handle) {
      try {
        const db = await idbOpen();
        await new Promise((res, rej) => {
          const tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).put(handle, 'dir');
          tx.oncomplete = res;
          tx.onerror = () => rej(tx.error);
        });
      } catch (e) { /* non-fatal */ }
    }
    async function loadHandle() {
      try {
        const db = await idbOpen();
        return await new Promise((res, rej) => {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const r = tx.objectStore(IDB_STORE).get('dir');
          r.onsuccess = () => res(r.result || null);
          r.onerror = () => rej(r.error);
        });
      } catch (e) { return null; }
    }

    // Content snapshots for change diffs. The File System Access API exposes
    // no previous versions, so we store each artifact's raw text (plus the
    // mtime it was read at) after every scan; the next scan line-diffs against
    // it. These survive reloads, so diffs hold across page refreshes too.
    async function getSnapshot(rel) {
      const db = await idbOpen();
      return await new Promise((res, rej) => {
        const tx = db.transaction(IDB_SNAP, 'readonly');
        const r = tx.objectStore(IDB_SNAP).get(rel);
        r.onsuccess = () => res(r.result || null);
        r.onerror = () => rej(r.error);
      });
    }
    async function putSnapshot(rel, snap) {
      const db = await idbOpen();
      await new Promise((res, rej) => {
        const tx = db.transaction(IDB_SNAP, 'readwrite');
        tx.objectStore(IDB_SNAP).put(snap);
        tx.oncomplete = res;
        tx.onerror = () => rej(tx.error);
      });
    }
    async function deleteSnapshot(rel) {
      const db = await idbOpen();
      await new Promise((res, rej) => {
        const tx = db.transaction(IDB_SNAP, 'readwrite');
        tx.objectStore(IDB_SNAP).delete(rel);
        tx.oncomplete = res;
        tx.onerror = () => rej(tx.error);
      });
    }
    async function clearSnapshots() {
      try {
        const db = await idbOpen();
        await new Promise((res, rej) => {
          const tx = db.transaction(IDB_SNAP, 'readwrite');
          tx.objectStore(IDB_SNAP).clear();
          tx.oncomplete = res;
          tx.onerror = () => rej(tx.error);
        });
      } catch (e) { /* non-fatal */ }
    }

    pickBtn.addEventListener('click', async () => {
      if (window.showDirectoryPicker) {
        try {
          const saved = await loadHandle();
          let dir;
          try {
            // Open the picker at the previously used folder when possible.
            dir = await window.showDirectoryPicker({ startIn: saved || undefined });
          } catch (err) {
            if (err.name === 'AbortError') throw err;         // user cancelled
            dir = await window.showDirectoryPicker();          // stale handle -> fresh
          }
          dirHandle.value = dir;
          saveHandle(dir);
          await startMonitoring(dir);
        } catch (err) {
          if (err.name !== 'AbortError') {
            alert('Folder access failed: ' + err.message);
          }
        }
      } else {
        picker.click();
      }
    });

    picker.addEventListener('change', async e => {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      // Remember the project/openspec prefix so prompts can show full paths.
      storePrefix = derivePrefix(files[0].webkitRelativePath || '');
      stopMonitoring();
      await loadFiles(files.map(f => ({ rel: normPath(f.webkitRelativePath), handle: f })));
    });

    // Extract the leading 'project/openspec' path from a raw upload path
    // (e.g. 'llmclip/openspec/specs/…' -> 'llmclip/openspec/').
    function derivePrefix(rawPath) {
      const m = String(rawPath).match(/^(.*?\bopenspec\b)(?=\/|$)/);
      return m ? m[0] + '/' : '';
    }

    /* ---------- Loading ---------- */

    async function loadFiles(raw) {
      setLoading('Loading files…');
      try {
        allFiles.value = raw
          .filter(f => isRelevant(f.rel) && groupOf(f.rel))
          .sort((a, b) => a.rel.localeCompare(b.rel));
        paneCache.clear();
        fileState.clear();
        recentRels.value = new Set();
        diffInfo.clear();
        freshDiffs.clear();
        currentRel.value = null;
        currentKey.value = null;
        pruneHighlights();
        await autoOpenFirst();
      } finally {
        setLoading(null);
      }
    }

    async function autoOpenFirst() {
      const first = allFiles.value.find(f =>
        groupOf(f.rel) === 'Changes' && f.rel.endsWith('/proposal.md'))
        || allFiles.value.find(f => groupOf(f.rel) === 'Changes')
        || allFiles.value[0];
      if (first) await openFile(first.rel);
    }

    /* ---------- Live monitoring ---------- */

    async function startMonitoring(handle, keepSnapshots) {
      dirHandle.value = handle;
      // The picked folder is the project root (use its name) or openspec itself.
      storePrefix = handle && handle.name && handle.name !== 'openspec'
        ? handle.name + '/openspec/'
        : 'openspec/';
      // Fresh pick: drop the previous folder's baseline and markers so the
      // first scan doesn't flag everything as newly changed. autoReopen on
      // reload keeps persisted snapshots so content diffs survive a refresh.
      if (!keepSnapshots) clearSnapshots();
      fileState.clear();
      recentRels.value = new Set();
      diffInfo.clear();
      freshDiffs.clear();
      await scan(true);
      if (!currentRel.value) await autoOpenFirst();
      clearInterval(pollTimer);
      pollTimer = setInterval(() => scan(false), 10000);
    }

    function stopMonitoring() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      dirHandle.value = null;
    }

    async function* walkDir(dir, prefix) {
      for await (const entry of dir.values()) {
        if (entry.kind === 'directory') {
          yield* walkDir(entry, prefix + entry.name + '/');
        } else {
          yield [prefix + entry.name, entry];
        }
      }
    }

    async function scan(initial) {
      if (!dirHandle.value || isScanning) return;
      isScanning = true;
      if (initial) setLoading('Reading folder…');
      let found = 0, lastUiAt = 0;
      try {
        const current = new Map();
        for await (const root of dirHandle.value.values()) {
          const rel0 = normPath(root.name);
          if (root.kind === 'directory') {
            // normPath can collapse the picked 'openspec' dir to ''; join without
            // a leading slash so startsWith('changes/') checks still match.
            const prefix = rel0 ? rel0 + '/' : '';
            for await (const [rel, handle] of walkDir(root, prefix)) {
              if (!isRelevant(rel) || !groupOf(rel)) continue;
              found++;
              const file = await handle.getFile();
              current.set(rel, { handle, lastModified: file.lastModified });
              const now = performance.now();
              if (initial && now - lastUiAt > 150) {
                lastUiAt = now;
                setLoading(`Reading folder… ${found} files`);
              }
            }
          } else {
            if (!isRelevant(rel0) || !groupOf(rel0)) continue;
            const file = await root.getFile();
            current.set(rel0, { handle: root, lastModified: file.lastModified });
          }
        }

        let changed = false;
        let activeChanged = false;
        const hadPrior = fileState.size > 0;   // false on the very first scan
        const updates = [];
        const diffsSeen = [];   // rels whose content diffed vs the persisted snapshot this scan
        let removals = 0;
        for (const [rel, info] of current) {
          const prev = fileState.get(rel);
          const modified = !prev || prev.lastModified !== info.lastModified;
          if (modified) {
            // Content-level diff against the persisted snapshot. The File System
            // Access API exposes no old versions, so snapshots are how we know
            // exactly what changed; they survive reloads, so diffs hold across
            // page refreshes too. IndexedDB failure just degrades to the
            // file-level markers below.
            try {
              const text = await handleText(info.handle);
              const snap = await getSnapshot(rel);
              if (snap && snap.text !== undefined && snap.text !== text) {
                const d = diffLines(snap.text, text);
                if (d) { diffInfo.set(rel, d); diffsSeen.push(rel); }
                else diffInfo.delete(rel);
              } else if (!snap) {
                diffInfo.delete(rel);   // first baseline — nothing to diff yet
              }
              await putSnapshot(rel, { rel, text, mtime: info.lastModified });
            } catch (e) { /* snapshotting unavailable — markers still work */ }
            paneCache.delete(rel);
          }
          if (!prev) {
            changed = true;
            if (hadPrior) updates.push(rel);
          } else if (prev.lastModified !== info.lastModified) {
            changed = true;
            if (hadPrior) updates.push(rel);
            if (rel === currentRel.value) activeChanged = true;
          }
        }
        for (const rel of fileState.keys()) {
          if (!current.has(rel)) {
            changed = true;
            paneCache.delete(rel);
            diffInfo.delete(rel);
            freshDiffs.delete(rel);
            if (hadPrior) {
              removals++;
              try { await deleteSnapshot(rel); } catch (e) {}   // drop its diff baseline too
            }
          }
        }

        // The file currently open was deleted.
        if (currentRel.value && !fileState.has(currentRel.value) && !current.has(currentRel.value)) {
          contentEl.innerHTML = '<div class="empty" style="margin-top:2rem">The open file was deleted while monitoring.</div>';
          currentRel.value = null;
          currentKey.value = null;
        }

        fileState.clear();
        current.forEach((v, k) => fileState.set(k, v));

        // Content diffs drive the same markers as file-level updates, and mark
        // their panes to auto-open the diff on first view.
        if (diffsSeen.length) {
          const fresh = diffsSeen.filter(rel => !recentRels.value.has(rel));
          diffsSeen.forEach(rel => freshDiffs.add(rel));
          if (fresh.length) recentRels.value = new Set([...recentRels.value, ...fresh]);
        }

        if (hadPrior && (updates.length || removals)) {
          const added = updates.filter(rel => !recentRels.value.has(rel));
          if (added.length) recentRels.value = new Set([...recentRels.value, ...added]);
          const parts = [];
          if (added.length) parts.push(`${added.length} artifact${added.length === 1 ? '' : 's'} updated`);
          if (removals) parts.push(`${removals} deleted`);
          if (parts.length) showToast(parts.join(' · '));
        } else if (!hadPrior && diffsSeen.length) {
          // Reload or re-open of the same folder: markers come from persisted
          // snapshots, so changes since the last visit still surface.
          showToast(`${diffsSeen.length} artifact${diffsSeen.length === 1 ? '' : 's'} changed since your last visit`);
        }

        if (changed && fileState.size) {
          allFiles.value = [...fileState.entries()]
            .map(([rel, info]) => ({ rel, handle: info.handle }))
            .sort((a, b) => a.rel.localeCompare(b.rel));
          if (activeChanged) await rerenderCurrent();
        }
      } finally {
        isScanning = false;
        setLoading(null);
      }
    }

    async function rerenderCurrent() {
      if (currentKey.value) await openChange(currentKey.value, currentRel.value);
      else if (currentRel.value) await openFile(currentRel.value);
    }

    /* ---------- Sidebar list ---------- */

    // Archive is collapsed by default on first visit; the persisted choice
    // is loaded into the `collapsed` signal at startup.
    function safeParse(v) {
      try { const a = JSON.parse(v); return Array.isArray(a) ? a : []; } catch (e) { return []; }
    }

    function toggleGroup(g) {
      const s = new Set(collapsed.value);
      if (s.has(g)) s.delete(g); else s.add(g);
      collapsed.value = s;
      try { localStorage.setItem('osviewer.collapsed', JSON.stringify([...s])); } catch (e) {}
    }

    // Compact +/- counts next to an artifact or change in the list.
    function diffHint(diffs) {
      let a = 0, r = 0;
      for (const d of diffs) { a += d.added; r += d.removed; }
      if (!a && !r) return '';
      return html`<span class="diff-hint" title="Line changes since last snapshot">${
        a ? html`<b class="dh-add">+${a}</b>` : ''} ${
        r ? html`<b class="dh-del">−${r}</b>` : ''}</span>`;
    }

    function buildListHtml() {
      const q = search.value.trim().toLowerCase();
      const forceOpen = q.length > 0; // searching always expands groups

      const sections = [];
      for (const g of GROUPS) {
        if (g === 'Archive' || g === 'Changes') {
          // One row per change (active or archived), labeled with its name.
          const keys = [...new Set(allFiles.value
            .filter(f => groupOf(f.rel) === g)
            .map(f => changeOf(f.rel)))];
          const rows = keys.map(k => changeMeta.value.get(k))
            .filter(m => m && (!q || (m.label + ' ' + m.dir + ' ' + m.key).toLowerCase().includes(q)));
          if (rows.length) sections.push({ g, rows });
        } else {
          const items = allFiles.value.filter(f => {
            if (groupOf(f.rel) !== g) return false;
            if (q && !f.rel.toLowerCase().includes(q)) return false;
            return true;
          });
          if (items.length) sections.push({ g, items });
        }
      }

      let out = sections.length ? '' : '<div class="empty">No artifacts found.</div>';

      sections.forEach(sec => {
        const g = sec.g;
        const items = sec.items || sec.rows;
        const isCollapsed = collapsed.value.has(g) && !forceOpen;
        const stickyCls = g === 'Changes' ? ' sticky' : '';
        const newCount = (g === 'Changes' || g === 'Archive')
          ? sec.rows.filter(r => r.files.some(f => recentRels.value.has(f.rel))).length
          : items.filter(f => recentRels.value.has(f.rel)).length;
        out += html`
          <div class="group-label g-${g.toLowerCase()}${stickyCls}${isCollapsed ? ' collapsed' : ''}" data-group="${g}">
            <span class="chevron">▾</span>
            <span class="group-name">${g}</span>
            ${newCount ? html`<span class="group-new">+${newCount} new</span>` : ''}
            <span class="group-count">${items.length}</span>
          </div>`;
        if (!isCollapsed) {
          if (g === 'Archive' || g === 'Changes') {
            sec.rows.forEach(m => {
              const active = m.key === currentKey.value;
              const isNew = m.files.some(f => recentRels.value.has(f.rel));
              const cnt = m.files.reduce((s, f) => s + (highlights.value.get(f.rel) || []).length, 0);
              out += html`<div class="item change-row${active ? ' active' : ''}${isNew ? ' new' : ''}" data-key="${m.key}">
                ${isNew ? html`<span class="new-dot" title="Updated since last scan"></span>` : ''}
                <span class="path">${m.label}</span>
                ${cnt ? html`<span class="cmt-count">${cnt}</span>` : ''}
                ${diffHint(m.files.map(f => diffInfo.get(f.rel)).filter(Boolean))}
                ${m.date ? html`<span class="date">${m.date}</span>` : ''}
              </div>`;
            });
          } else {
            sec.items.forEach(f => {
              const active = f.rel === currentRel.value;
              const isNew = recentRels.value.has(f.rel);
              const cnt = (highlights.value.get(f.rel) || []).length;
              // Specs/Config sections need no badge — the section color says it.
              const badge = (g === 'Specs' || g === 'Config') ? '' :
                html`<span class="badge ${artifactOf(f.rel).toLowerCase()}">${artifactOf(f.rel)}</span>`;
              out += html`<div class="item${active ? ' active' : ''}${isNew ? ' new' : ''}" data-rel="${f.rel}">
                ${isNew ? html`<span class="new-dot" title="Updated since last scan"></span>` : ''}
                <span class="path">${displayLabel(f.rel, g)}</span>
                ${cnt ? html`<span class="cmt-count">${cnt}</span>` : ''}
                ${diffHint([diffInfo.get(f.rel)].filter(Boolean))}
                ${badge}
              </div>`;
            });
          }
        }
      });

      return out;
    }

    searchEl.addEventListener('input', () => { search.value = searchEl.value; });
    document.addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement !== searchEl) {
        e.preventDefault();
        searchEl.focus();
      }
      if (e.key === 'Escape' && document.activeElement === searchEl) {
        searchEl.value = '';
        search.value = '';
        searchEl.blur();
      }
    });

    /* ---------- Rendering ---------- */

    function crumbFor(rel) {
      let segs = rel.split('/');
      // Spec files: show the capability path, not a trailing spec.md.
      if (segs.length > 1 && segs[segs.length - 1] === 'spec.md') segs = segs.slice(0, -1);
      return joinHtml(segs.map((seg, i) =>
        i === segs.length - 1
          ? html`<span class="file">${seg}</span>`
          : html`<span class="seg">${seg}</span><span class="sep">/</span>`));
    }

    // Read raw text from a FileSystemFileHandle or an uploaded File.
    async function handleText(h) {
      return typeof h.getFile === 'function' ? await (await h.getFile()).text() : await h.text();
    }

    function splitLines(s) {
      const t = String(s).replace(/\r\n?/g, '\n');
      if (t === '') return [];
      const lines = t.split('\n');
      if (lines[lines.length - 1] === '') lines.pop();   // drop the trailing empty line
      return lines;
    }

    // Line-by-line diff (LCS with a 3-line context window). Returns null for
    // identical texts. Fine for small artifacts; very large files degrade to a
    // single all-changed hunk instead of a giant DP table.
    function diffLines(oldText, newText) {
      const a = splitLines(oldText), b = splitLines(newText);
      if (a.join('\n') === b.join('\n')) return null;
      const n = a.length, m = b.length;
      const ops = [];
      if (n * m > 4000000) {
        for (let i = 0; i < n; i++) ops.push(['-', i]);
        for (let j = 0; j < m; j++) ops.push(['+', j]);
      } else {
        const dp = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
        for (let i = n - 1; i >= 0; i--)
          for (let j = m - 1; j >= 0; j--)
            dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
        let i = 0, j = 0;
        while (i < n && j < m) {
          if (a[i] === b[j]) { ops.push(['=', i, j]); i++; j++; }
          else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push(['-', i]); i++; }
          else { ops.push(['+', j]); j++; }
        }
        while (i < n) { ops.push(['-', i]); i++; }
        while (j < m) { ops.push(['+', j]); j++; }
      }

      // Keep CLOSE lines of context around each change, then group the
      // contiguous marked runs into hunks.
      const CLOSE = 3;
      const max = ops.length;
      const marked = new Uint8Array(max);
      for (let k = 0; k < max; k++) {
        if (ops[k][0] === '=') continue;
        for (let t = Math.max(0, k - CLOSE); t <= Math.min(max - 1, k + CLOSE); t++) marked[t] = 1;
      }
      const hunks = [];
      let oldPos = 0, newPos = 0;   // 0-based positions consumed so far
      let k = 0;
      while (k < max) {
        if (!marked[k]) {
          if (ops[k][0] !== '+') oldPos++;
          if (ops[k][0] !== '-') newPos++;
          k++;
          continue;
        }
        const oldStart = oldPos + 1, newStart = newPos + 1;
        const lines = [];
        let oc = 0, nc = 0;         // old/new line counts inside this hunk
        while (k < max && marked[k]) {
          const t = ops[k][0];
          if (t === '=') { lines.push([' ', oldPos + 1, newPos + 1, a[ops[k][1]]]); oldPos++; newPos++; oc++; nc++; }
          else if (t === '-') { lines.push(['-', oldPos + 1, 0, a[ops[k][1]]]); oldPos++; oc++; }
          else { lines.push(['+', 0, newPos + 1, b[ops[k][1]]]); newPos++; nc++; }
          k++;
        }
        hunks.push({ oldStart, newStart, oldCount: oc, newCount: nc, lines });
      }
      let added = 0, removed = 0;
      for (const h of hunks) for (const l of h.lines) {
        if (l[0] === '+') added++;
        if (l[0] === '-') removed++;
      }
      return { hunks, added, removed, ts: Date.now() };
    }

    function relTime(ts) {
      const m = Math.floor((Date.now() - ts) / 60000);
      if (m < 1) return 'just now';
      if (m < 60) return m + ' min ago';
      const h = Math.floor(m / 60);
      if (h < 24) return h + (h === 1 ? ' hr ago' : ' hrs ago');
      const d = Math.floor(h / 24);
      return d + (d === 1 ? ' day ago' : ' days ago');
    }

    function hunkHeader(h) {
      const f = (start, count) => count === 1 ? String(start) : `${start},${count}`;
      return `@@ -${f(h.oldStart, h.oldCount)} +${f(h.newStart, h.newCount)} @@`;
    }

    // Collapsible unified diff rendered above an artifact pane. Stays out of
    // .annotatable so highlight offsets keep matching the rendered content.
    function diffBlock(di, autoOpen) {
      return html`<details class="diff"${autoOpen ? ' open' : ''}>
        <summary>
          <span>Changed since last snapshot</span>
          ${di.added ? html`<b class="dh-add">+${di.added}</b>` : ''}
          ${di.removed ? html`<b class="dh-del">−${di.removed}</b>` : ''}
          <span class="diff-ts">${relTime(di.ts)}</span>
        </summary>
        <pre class="diff-view">${
          joinHtml(di.hunks.map(h => html`
            <div class="diff-line hdr"><span class="ln">@@</span><span class="sign"></span><span class="code">${hunkHeader(h)}</span></div>
            ${joinHtml(h.lines.map(l => {
              const [t, oln, nln, text] = l;
              const cls = t === '+' ? 'add' : t === '-' ? 'del' : 'ctx';
              return html`<div class="diff-line ${cls}"><span class="ln">${t === '+' ? nln : oln}</span><span class="sign">${t}</span><span class="code">${text}</span></div>`;
            }))}
          `))
        }</pre>
      </details>`;
    }

    async function paneHtml(rel) {
      if (paneCache.has(rel)) return paneCache.get(rel);
      const entry = allFiles.value.find(f => f.rel === rel);
      if (!entry) return '<div class="empty">File not found.</div>';
      const di = diffInfo.get(rel);
      const diffHtml = di ? diffBlock(di, freshDiffs.has(rel)) : '';
      const text = await handleText(entry.handle);
      const name = rel.split('/').pop();
      // config.yaml renders raw only — the metadata card is redundant with the
      // file's own schema/context/rules keys. Metadata files keep the card.
      const isConfig = rel === 'config.yaml';
      const pane = (name.endsWith('.yaml') || name.endsWith('.yml'))
        ? yamlPane(text, !isConfig) : markdownPane(rel, text);
      paneCache.set(rel, diffHtml + pane);
      return paneCache.get(rel);
    }

    // A change artifact (proposal/spec/design/tasks/metadata) opens the whole
    // change in a tabbed view instead of a single file.
    async function openFile(rel) {
      const entry = allFiles.value.find(f => f.rel === rel);
      if (!entry) return;
      hideAnnBubble();
      const key = changeOf(rel);
      if (key) { openChange(key, rel); return; }
      currentRel.value = rel;
      currentKey.value = null;
      if (recentRels.value.has(rel)) {
        const s = new Set(recentRels.value);
        s.delete(rel);
        recentRels.value = s;
      }
      contentEl.innerHTML = html`<div class="crumb">${crumbFor(rel)}</div><div class="pane-loading">Loading…</div>`;
      contentEl.querySelector('.pane-loading').outerHTML = await paneHtml(rel);
      applyHighlights(rel);
      contentEl.scrollTop = 0;
    }

    async function openChange(key, initialRel) {
      const meta = changeMeta.value.get(key);
      if (!meta) return;
      hideAnnBubble();
      currentKey.value = key;
      currentRel.value = initialRel || meta.proposalRel || null;
      if (meta.files.some(f => recentRels.value.has(f.rel))) {
        const s = new Set(recentRels.value);
        meta.files.forEach(f => s.delete(f.rel));
        recentRels.value = s;
      }

      // Tabs in order: proposal, specs…, design, tasks, metadata
      const tabs = [];
      const push = (rel, label) => { if (rel) tabs.push({ rel, label }); };
      const prop = meta.files.find(f => f.rel.endsWith('/proposal.md'));
      const specs = meta.files
        .filter(f => f.rel.includes('/specs/') && f.rel.endsWith('spec.md'))
        .sort((a, b) => a.rel.localeCompare(b.rel));
      const design = meta.files.find(f => f.rel.endsWith('/design.md'));
      const tasks = meta.files.find(f => f.rel.endsWith('/tasks.md'));
      const metaYaml = meta.files.find(f => f.rel.endsWith('.openspec.yaml'));
      push(prop && prop.rel, 'Proposal');
      specs.forEach(s => {
        const cap = s.rel.slice(s.rel.indexOf('/specs/') + 1)
          .replace(/^specs\//, '').replace(/\/spec\.md$/, '');
        push(s.rel, specs.length === 1 ? 'Spec' : `Spec · ${cap}`);
      });
      push(design && design.rel, 'Design');
      push(tasks && tasks.rel, 'Tasks');
      push(metaYaml && metaYaml.rel, 'Metadata');
      currentTabs = tabs;

      const tabBar = joinHtml(tabs.map((t, i) =>
        html`<button class="tab ${artifactOf(t.rel).toLowerCase()}${t.rel === currentRel.value ? ' active' : ''}" data-i="${i}">${t.label}</button>`));

      contentEl.innerHTML = html`
        <div class="crumb">${crumbFor(meta.key)}</div>
        <div class="change-head">
          <h2>${meta.label}</h2>
          ${meta.date ? html`<span class="date-badge">${meta.date}</span>` : ''}
        </div>
        <div class="tabs">${tabBar}</div>
        <div id="tab-panes" class="pane-loading">Loading…</div>`;

      contentEl.querySelectorAll('.tab').forEach(btn =>
        btn.addEventListener('click', () => activateTab(+btn.dataset.i)));

      const start = Math.max(0, tabs.findIndex(t => t.rel === currentRel.value));
      await activateTab(start);
    }

    async function activateTab(i) {
      const t = currentTabs[i];
      if (!t) return;
      currentRel.value = t.rel;
      contentEl.querySelectorAll('.tab').forEach(b =>
        b.classList.toggle('active', +b.dataset.i === i));
      const panes = contentEl.querySelector('#tab-panes');
      panes.className = '';
      panes.innerHTML = await paneHtml(t.rel);
      applyHighlights(t.rel);
      contentEl.scrollTop = 0;
    }

    function yamlPane(text, showMeta = true) {
      let card = '';
      if (showMeta) {
        try {
          const data = jsyaml.load(text);
          if (data && typeof data === 'object') {
            card = metaCard(Object.entries(data).map(([k, v]) =>
              [k, v === null ? 'null' : typeof v === 'object' ? JSON.stringify(v, null, 2) : String(v)]));
          }
        } catch (err) {
          card = html`<div class="meta-error">YAML parse failed: ${err.message}</div>`;
        }
      }
      return html`${card}<pre class="yaml-view annotatable">${text}</pre>`;
    }

    function markdownPane(rel, text) {
      const { meta, body } = parseFrontmatter(text);

      let metaHtml = '';
      if (meta && typeof meta === 'object' && !meta._error) {
        const rows = Object.entries(meta).map(([k, v]) =>
          html`<tr><td>${k}</td><td>${
            v === null || v === undefined ? '' :
            typeof v === 'object' ? html`<pre class="yaml-view" style="padding:6px">${JSON.stringify(v, null, 2)}</pre>` :
            v}</td></tr>`);
        metaHtml = html`<div class="meta-card"><h3>${artifactOf(rel)} metadata</h3><table class="meta-table">${joinHtml(rows)}</table></div>`;
      } else if (meta && meta._error) {
        metaHtml = html`<div class="meta-card"><h3>Frontmatter</h3><div class="meta-error">Could not parse: ${meta._error}</div></div>`;
      }

      // Tasks progress
      const tasks = body.match(/^\s*[-*]\s+\[([ xX])\]/gm) || [];
      let progressHtml = '';
      if (tasks.length) {
        const done = tasks.filter(t => /\[[xX]\]/.test(t)).length;
        const pct = Math.round(done / tasks.length * 100);
        progressHtml = html`<div class="progress">${done}/${tasks.length} tasks done · ${pct}%</div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>`;
      }

      const safe = DOMPurify.sanitize(marked.parse(body, { breaks: true })
        .replace(/<li>\[([ xX])\]\s*</g, (m, s) =>
          `<li class="task-${(s === 'x' || s === 'X') ? 'done' : 'open'}"><input type="checkbox" ${s !== ' ' ? 'checked' : ''} disabled>`));

      return html`${progressHtml}${metaHtml}<div class="markdown annotatable">${htmlRaw(safe)}</div>`;
    }

    function parseFrontmatter(text) {
      const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
      if (!m) return { meta: null, body: text };
      let meta = null;
      try { meta = jsyaml.load(m[1]); } catch (e) { meta = { _error: e.message }; }
      return { meta, body: text.slice(m[0].length) };
    }

    function metaCard(rows) {
      return html`<div class="meta-card"><h3>Metadata</h3><table class="meta-table">${
        joinHtml(rows.map(([k, v]) => html`<tr><td>${k}</td><td>${v}</td></tr>`))}</table></div>`;
    }

    /* ---------- Review: highlights & comments → LLM fix prompt ---------- */

    let annBubble = null;          // floating selection toolbar / comment editor
    let annPending = null;         // { start, end, text } awaiting a comment

    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

    function loadHighlights() {
      try {
        const obj = JSON.parse(localStorage.getItem('osviewer.highlights') || '{}');
        const m = new Map();
        for (const [rel, list] of Object.entries(obj)) {
          if (Array.isArray(list)) m.set(rel, list);
        }
        highlights.value = m;
      } catch (e) {}
    }
    loadHighlights();

    function persistHighlights() {
      try {
        const obj = {};
        for (const [rel, list] of highlights.value) if (list.length) obj[rel] = list;
        localStorage.setItem('osviewer.highlights', JSON.stringify(obj));
      } catch (e) {}
    }

    // Replace the highlights for one artifact; new Map so the signal fires.
    function setHighlights(rel, list) {
      const m = new Map(highlights.value);
      if (list.length) m.set(rel, list); else m.delete(rel);
      highlights.value = m;
      persistHighlights();
    }

    // Drop highlights whose artifact no longer exists (new folder / reload).
    function pruneHighlights() {
      const m = new Map();
      for (const [rel, list] of highlights.value) {
        if (allFiles.value.some(f => f.rel === rel)) m.set(rel, list);
      }
      highlights.value = m;
      persistHighlights();
    }

    // Read a file's raw text (File System handle or uploaded File).
    async function readFileText(rel) {
      const entry = allFiles.value.find(f => f.rel === rel);
      if (!entry) return '';
      const f = entry.handle;
      return typeof f.getFile === 'function' ? await (await f.getFile()).text() : await f.text();
    }

    // 1-based line numbers in `raw` that contain `text`.
    function refLines(raw, text) {
      const out = [];
      if (text) raw.split('\n').forEach((line, i) => { if (line.includes(text)) out.push(i + 1); });
      return out;
    }

    /* ---- Selection → floating toolbar ---- */

    function findAnnContainer(range) {
      const cNode = range.commonAncestorContainer;
      const cEl = cNode.nodeType === 1 ? cNode : cNode.parentElement;
      const container = cEl && cEl.closest('.annotatable');
      if (!container) return null;
      const startEl = range.startContainer.nodeType === 1 ? range.startContainer : range.startContainer.parentElement;
      const endEl = range.endContainer.nodeType === 1 ? range.endContainer : range.endContainer.parentElement;
      if (!container.contains(startEl) || !container.contains(endEl)) return null;
      return container;
    }

    // Character offset of a boundary (node, offset) within root's text content.
    // Counts text nodes directly (never Range.toString) so <br> and element
    // boundaries don't shift offsets.
    function textInSubtree(node) {
      if (node.nodeType === 3) return node.data.length;   // tree walker skips its own root
      let count = 0;
      const w = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
      let n;
      while ((n = w.nextNode())) count += n.data.length;
      return count;
    }
    function textOffsetAt(root, node, offset) {
      if (node === root && node.nodeType === 1) {           // boundary at the container itself
        const before = node.childNodes[offset - 1];
        return before ? textInSubtree(before) : 0;
      }
      const w = document.createNodeIterator(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
      let acc = 0, n;
      while ((n = w.nextNode())) {
        if (n === node) {
          if (n.nodeType === 3) return acc + Math.min(offset, n.data.length);
          const before = n.childNodes[offset - 1];
          return acc + (before ? textInSubtree(before) : 0);
        }
        if (n.nodeType === 3) acc += n.data.length;
      }
      return acc;
    }
    function selOffsets(container, range) {
      const start = textOffsetAt(container, range.startContainer, range.startOffset);
      const end = textOffsetAt(container, range.endContainer, range.endOffset);
      const text = container.textContent.slice(start, end);
      return { start, end, text };
    }

    function hideAnnBubble() {
      if (annBubble) { annBubble.remove(); annBubble = null; }
      annPending = null;
    }

    function onSelect() {
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed || sel.rangeCount === 0) return;
      const range = sel.getRangeAt(0);
      const container = findAnnContainer(range);
      if (!container) return;
      const info = selOffsets(container, range);
      if (!info.text.trim()) return;
      showAnnBubble(range, info);
    }

    function showAnnBubble(range, info) {
      hideAnnBubble();
      const rect = range.getBoundingClientRect();
      const bub = document.createElement('div');
      bub.className = 'ann-bubble';
      bub.innerHTML = '<button type="button" class="ann-add">💬 Comment</button>';
      bub.style.top = (rect.bottom + 8) + 'px';
      bub.style.left = Math.max(8, Math.min(rect.left, innerWidth - 990)) + 'px';
      document.body.appendChild(bub);
      annBubble = bub;
      annPending = info;
      bub.querySelector('.ann-add').addEventListener('click', () => {
        bub.innerHTML = `
          <textarea class="ann-text" rows="3" placeholder="What should be fixed?"></textarea>
          <div class="ann-actions">
            <button type="button" class="ann-cancel">Cancel</button>
            <button type="button" class="ann-save">Save comment</button>
          </div>`;
        bub.querySelector('.ann-cancel').addEventListener('click', hideAnnBubble);
        bub.querySelector('.ann-save').addEventListener('click', saveAnnComment);
        const ta = bub.querySelector('.ann-text');
        ta.focus();
        ta.addEventListener('keydown', e => {
          // Enter saves (Ctrl/Cmd+Enter too); Shift+Enter inserts a newline.
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            saveAnnComment();
          }
          if (e.key === 'Escape') hideAnnBubble();
        });
      });
    }

    async function saveAnnComment() {
      const rel = currentRel.value;
      if (!rel || !annPending) return;
      const ta = annBubble && annBubble.querySelector('.ann-text');
      const comment = ta ? ta.value.trim() : '';
      const { start, end, text } = annPending;
      const list = highlights.value.get(rel) || [];
      if (list.some(h => h.start < end && start < h.end)) {
        showToast('Selection overlaps an existing highlight', 'error');
        hideAnnBubble();
        return;
      }
      const isFirst = list.length === 0;
      // Store the file path and the raw lines referencing the text so the
      // highlight can be re-anchored after a reload.
      let lines = [];
      try { lines = refLines(await readFileText(rel), text); } catch (e) {}
      list.push({ id: uid(), start, end, text, comment, ts: Date.now(), rel, lines });
      setHighlights(rel, list);
      hideAnnBubble();
      try { window.getSelection().removeAllRanges(); } catch (e) {}
      applyHighlights(rel);
      if (isFirst) openReviewPanel();
      showToast(comment ? 'Comment added' : 'Highlight added');
    }

    contentEl.addEventListener('mouseup', onSelect);
    contentEl.addEventListener('keyup', onSelect);
    document.addEventListener('mousedown', e => {
      if (annBubble && !annBubble.contains(e.target)) hideAnnBubble();
    });
    contentEl.addEventListener('scroll', () => {
      if (!annBubble) return;
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) { hideAnnBubble(); return; }
      const rect = sel.getRangeAt(0).getBoundingClientRect();
      annBubble.style.top = (rect.bottom + 8) + 'px';
      annBubble.style.left = Math.max(8, Math.min(rect.left, innerWidth - 990)) + 'px';
    }, { passive: true });

    /* ---- Applying highlight marks ---- */

    function findTextNodeAt(root, offset) {
      const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      let n, acc = 0, last = null;
      while ((n = w.nextNode())) {
        last = n;
        if (acc + n.data.length > offset) return [n, offset - acc];
        acc += n.data.length;
      }
      if (last && offset === acc) return [last, last.data.length];
      return null;
    }

    function wrapTextNode(node, from, to, h) {
      if (to <= from) return;
      const mark = document.createElement('mark');
      mark.className = 'hl';
      mark.dataset.id = h.id;
      mark.title = h.comment || 'Highlight';
      mark.addEventListener('click', () => focusComment(h.id));
      const text = node.data;
      const frag = document.createDocumentFragment();
      if (from > 0) frag.appendChild(document.createTextNode(text.slice(0, from)));
      mark.appendChild(document.createTextNode(text.slice(from, to)));
      frag.appendChild(mark);
      if (to < text.length) frag.appendChild(document.createTextNode(text.slice(to)));
      node.parentNode.replaceChild(frag, node);
    }

    function wrapHighlight(container, h) {
      const t = container.textContent;
      if (!h.text || h.start < 0 || h.end > t.length || h.start >= h.end) return null;
      let start = h.start, end = h.end;
      // Re-anchor when the file changed and the old offsets no longer line up.
      if (t.slice(start, end) !== h.text) {
        const idx = t.indexOf(h.text);
        if (idx === -1) return null;
        start = idx;
        end = idx + h.text.length;
        h.start = start;
        h.end = end;
      }
      const sn = findTextNodeAt(container, start);
      const en = findTextNodeAt(container, end);
      if (!sn || !en) return null;
      // Wrap each intersecting text node on its own so a <mark> never spans a
      // block boundary (which would nest a <li> inside <mark> and break the DOM)
      // while still covering the full referenced range. Collect the target text
      // nodes first, then mutate, so the live NodeIterator never revisits the
      // fragment nodes we insert (which caused an infinite wrap loop).
      const nodes = [];
      if (sn[0] === en[0]) {
        nodes.push({ node: sn[0], from: sn[1], to: en[1] });
      } else {
        const w = document.createNodeIterator(container, NodeFilter.SHOW_TEXT);
        let n, seen = false;
        while ((n = w.nextNode())) {
          if (n === sn[0]) seen = true;
          if (!seen) continue;
          nodes.push({
            node: n,
            from: n === sn[0] ? sn[1] : 0,
            to: n === en[0] ? en[1] : n.data.length,
          });
          if (n === en[0]) break;
        }
      }
      for (const p of nodes) wrapTextNode(p.node, p.from, p.to, h);
      return nodes.length ? nodes[0].node : null;
    }

    function unwrapMark(mark) {
      const parent = mark.parentNode;
      if (!parent) return;
      while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
      parent.removeChild(mark);
    }

    function applyHighlights(rel) {
      const container = contentEl.querySelector('.annotatable');
      if (!container) return;
      container.querySelectorAll('mark.hl').forEach(unwrapMark);
      for (const h of highlights.value.get(rel) || []) wrapHighlight(container, h);
      // The open file has now been rendered; re-check staleness against it.
      // (Signals update synchronously, so without this the review panel would
      //  compare against the previous file's content right after a switch.)
      staleTick.value++;
    }

    /* ---- Review panel ---- */

    function openReviewPanel() {
      reviewEl.classList.add('open');
      reviewBtn.classList.add('active');
    }
    function closeReviewPanel() {
      reviewEl.classList.remove('open');
      reviewBtn.classList.remove('active');
    }

    function focusComment(id) {
      openReviewPanel();
      const item = reviewListEl.querySelector(`[data-id="${id}"]`);
      if (item) {
        item.scrollIntoView({ block: 'center' });
        item.classList.add('flash');
        setTimeout(() => item.classList.remove('flash'), 1400);
      }
    }

    // Jump from a review item to the text in the file, opening it first if needed.
    async function revealComment(rel, id) {
      openReviewPanel();
      if (rel !== currentRel.value) await openFile(rel);
      const mark = contentEl.querySelector(`mark.hl[data-id="${id}"]`);
      if (mark) {
        mark.scrollIntoView({ block: 'center', behavior: 'smooth' });
        mark.classList.add('active');
        setTimeout(() => mark.classList.remove('active'), 1400);
      }
    }

    function snippet(text) {
      const t = text.replace(/\s+/g, ' ').trim();
      return t.length > 90 ? t.slice(0, 90) + '…' : t;
    }

    // A highlight is stale only when its referenced text is absent from the
    // currently rendered view of its file. Compare against the rendered text
    // (not the raw markdown) so formatting like bullets, bold and code still
    // matches after a reload. Only the open file can be checked this way.
    function currentStaleIds() {
      const ids = new Set();
      if (!currentRel.value) return ids;
      const el = contentEl.querySelector('.annotatable');
      if (!el) return ids;
      const t = el.textContent;
      for (const h of highlights.value.get(currentRel.value) || []) {
        const ok = h.text && (t.includes(h.text) || t.slice(h.start, h.end) === h.text);
        if (!ok) ids.add(h.id);
      }
      return ids;
    }

    // Every highlight across every artifact, oldest first.
    function allHighlights() {
      const out = [];
      for (const [rel, list] of highlights.value) {
        if (!list.length) continue;
        for (const h of list) out.push({ rel, ...h });
      }
      out.sort((a, b) => a.ts - b.ts);
      return out;
    }

    function buildReviewHtml() {
      const items = allHighlights();
      if (!items.length) {
        return '<div class="rv-empty">Select text in any artifact and press <b>💬 Comment</b> to flag it for fixing.<br><br>Comments from all files are collected into a single fix prompt for an LLM.</div>';
      }
      const stale = currentStaleIds();
      return items.map((h, i) => html`
        <div class="rv-item${stale.has(h.id) ? ' stale' : ''}" data-id="${h.id}" data-rel="${h.rel}">
          <div class="rv-num">${i + 1}</div>
          <div class="rv-body">
            <div class="rv-file">${h.rel}</div>
            <div class="rv-text">${snippet(h.text)}</div>
            <div class="rv-comment">${h.comment ? h.comment : html`<span class="rv-nocomment">no comment</span>`}</div>
            ${stale.has(h.id) ? html`<div class="rv-stale">text not found in current content</div>` : ''}
          </div>
          <button class="rv-del" title="Delete" data-rel="${h.rel}" data-id="${h.id}">✕</button>
        </div>`).join('');
    }

    function deleteHighlight(rel, id) {
      const list = (highlights.value.get(rel) || []).filter(h => h.id !== id);
      setHighlights(rel, list);
      applyHighlights(rel);
    }

    reviewBtn.addEventListener('click', () => {
      if (reviewEl.classList.contains('open')) closeReviewPanel();
      else openReviewPanel();
    });
    document.getElementById('review-close').addEventListener('click', closeReviewPanel);

    /* ---- LLM fix prompt ---- */

    function buildPrompt() {
      const items = allHighlights();
      if (!items.some(h => h.comment)) return null;
      const lines = [
        'Please fix only the OpenSpec artifacts below, based on the provided review comments. Keep it simple and focused.',
        '',
        'Each artifact belongs to a change proposal. Read the whole proposal (all of its artifacts: proposal, specs, design, tasks) from the repository — they are not included here — and make each fix so all artifacts in the proposal stay consistent with each other.',
        '',
        'Rules:',
        '- Only change content referenced by a comment; preserve everything else exactly as-is.',
        '- Align each fix with the proposal the artifact belongs to (its proposal path is listed under the file).',
        '- If consistency requires it, fix the whole proposal so all its artifacts do not contradict each other.',
        '',
        '# Review comments',
      ];
      let prevRel = null, n = 0;
      for (const h of items) {
        if (h.rel !== prevRel) {
          prevRel = h.rel;
          n = 0;
          lines.push('', `## ${storePrefix}${h.rel}`);
          const key = changeOf(h.rel);
          const meta = key && changeMeta.value.get(key);
          const prop = meta && meta.proposalRel;
          if (prop) {
            lines.push(`Proposal: ${storePrefix}${prop}`);
            if (meta.files && meta.files.length) {
              lines.push('Artifacts in this proposal:');
              for (const f of meta.files) lines.push(`- ${storePrefix}${f.rel}`);
            }
          }
        }
        n++;
        lines.push(`${n}. ${h.comment || '(no comment — review this section for issues)'}`);
        lines.push(`   Referenced text: "${snippet(h.text)}"`);
      }
      return lines.join('\n');
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove();
      return ok;
    }

    copyPromptBtn.addEventListener('click', async () => {
      const prompt = await buildPrompt();
      if (!prompt) return;
      const ok = await copyText(prompt);
      showToast(ok ? 'Fix prompt copied to clipboard' : 'Copy failed — use Send to LLM', ok ? undefined : 'error');
    });

    sendLlmBtn.addEventListener('click', async () => {
      const prompt = await buildPrompt();
      if (!prompt) return;
      promptTextEl.value = prompt;
      promptModal.hidden = false;
    });
    document.getElementById('pmt-close').addEventListener('click', () => { promptModal.hidden = true; });
    document.getElementById('pmt-copy').addEventListener('click', async () => {
      const ok = await copyText(promptTextEl.value);
      showToast(ok ? 'Prompt copied to clipboard' : 'Copy failed', ok ? undefined : 'error');
    });
    document.getElementById('pmt-open').addEventListener('click', () => {
      const url = URL.createObjectURL(new Blob([promptTextEl.value], { type: 'text/plain;charset=utf-8' }));
      window.open(url, '_blank');
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    });
    promptModal.addEventListener('click', e => { if (e.target === promptModal) promptModal.hidden = true; });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !promptModal.hidden) promptModal.hidden = true;
    });

    // Welcome state
    contentEl.innerHTML = `
      <div class="welcome">
        <div class="icon">📋</div>
        <h2>OpenSpec Local Viewer</h2>
        <p>Choose your repository folder (or the <code>openspec/</code> folder) to browse
        change proposals, designs, task lists, and specs.</p>
        <p>Everything stays on your machine; files are read with the File API and never uploaded.</p>
      </div>`;

    // Re-open the previously used folder on reload (File System Access API only).
    async function autoReopen() {
      if (!window.showDirectoryPicker) return;   // upload fallback has no persistent handle
      try {
        const saved = await loadHandle();
        if (!saved) return;
        if (await saved.queryPermission({ mode: 'read' }) === 'granted') {
          await startMonitoring(saved, true);   // keep snapshots: diffs span reloads
        }
      } catch (e) { /* non-fatal */ }
    }
    autoReopen();

    // ---------- PWA ----------
    // Service worker only makes sense over http(s); it must not fail on file://.
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
