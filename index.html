<!DOCTYPE html>
<!-- OpenSpec Local Viewer v2.3.0 -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSpec Local Viewer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d1117">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="index.css">

  <!-- Vendored UMD libraries (classic scripts, loaded off window). The app
       imports them as ES module bindings via imports.js. -->
  <script src="lib/marked.umd.min.js"></script>
  <script src="lib/js-yaml.min.js"></script>
  <script src="lib/purify.min.js"></script>
  <script src="lib/fuse.min.js"></script>

  <!-- Set the theme before first paint to avoid a flash of the wrong scheme.
       Runs before the DOM renders; osv-header syncs the button state later. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('osviewer.theme');
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>

  <!-- The app needs an HTTP(S) server (ES modules + service worker). Show a
       clear message instead of a broken page when opened from file://. -->
  <script>
    (function () {
      if (location.protocol === 'file:') {
        var box = document.createElement('div');
        box.style.cssText = 'max-width:520px;margin:60px auto;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#c9d1d9;background:#161b22;border:1px solid #30363d;border-radius:8px;';
        box.innerHTML = '<h1 style="font-size:18px;margin:0 0 10px">OpenSpec Local Viewer needs a web server</h1>'
          + '<p style="margin:0 0 12px;font-size:14px;line-height:1.6">This app loads as ES modules and registers a service worker, so it cannot run from <code>file://</code>.</p>'
          + '<p style="margin:0 0 12px;font-size:14px;line-height:1.6">Serve this folder and open it in a browser, e.g.:</p>'
          + '<pre style="background:#0d1117;padding:10px;border-radius:6px;font-size:13px">python -m http.server 8743\n# then open http://127.0.0.1:8743/</pre>'
          + '<p style="margin:12px 0 0;font-size:13px;color:#8b949e">Or use the hosted version at ypyl.github.io/openspec-viewer/.</p>';
        document.body.replaceChildren(box);
      }
    })();
  </script>
</head>

<!-- Loads the app bootstrap: registers the web components and starts the app. -->
<script type="module" src="index.js"></script>

<body>
  <osv-header></osv-header>

  <div class="layout">
    <osv-file-list></osv-file-list>
    <osv-pane></osv-pane>
  </div>

  <osv-review></osv-review>
  <osv-prompt-modal></osv-prompt-modal>
  <osv-loading></osv-loading>
  <osv-toast></osv-toast>

  <noscript>
    <div class="empty">This app requires JavaScript. Please enable it to use the OpenSpec Local Viewer.</div>
  </noscript>
</body>
</html>
